name: Deploy staging

# Git Flow's preview leg: a push to `develop` migrates and deploys the `staging` environment
# from wrangler.jsonc once CI has passed on that commit. ci.yml calls this workflow as its last job,
# `deploy · staging`, behind `verify`, the unit suite and every e2e leg, so a red commit never
# reaches staging (ADR 0003, amendment 2026-09-15). Production stays in deploy-production.yml, on
# `main`. `workflow_dispatch` waits on nothing: it is for redeploying a commit by hand, or for
# shipping while CI itself is down.
#
# ── GitHub configuration this workflow needs ──────────────────────────────────────────────────
# secrets    CLOUDFLARE_API_TOKEN   Workers Scripts:Edit + D1:Edit on account 6cfdf3b5143cddc631383a4c14736c3a
#            CLOUDFLARE_ACCOUNT_ID  6cfdf3b5143cddc631383a4c14736c3a
#            SENTRY_AUTH_TOKEN      optional; without it no source maps are uploaded
# variables  VITE_POLAR_PRODUCT_PLUS_MONTHLY, VITE_POLAR_PRODUCT_PLUS_YEARLY,
#            VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY, VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY,
#            VITE_SENTRY_DSN, SENTRY_ORG, SENTRY_PROJECT
#
# The Worker's own runtime secrets (BETTER_AUTH_SECRET, POLAR_*, EMAIL_API_KEY, SENTRY_DSN, …)
# are NOT set here. They live in Cloudflare, put there once with
# `wrangler secret put <NAME> --env staging`, and a deploy neither reads nor replaces them.
# ──────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# `runs-on` below reads through `vars.RUNNER_DEPLOY`, an organisation variable that
# is deliberately unset: unset, the default here selects GitHub-hosted runners, and
# deploying is the one thing in this repository that does.
#
# Everything else used to run on the self-hosted pool - four CI slots on one local
# machine shared with the other repository - and since 2026-09-21 it no longer does
# either: `RUNNER_CI` is set to `["ubuntu-latest"]` on this repository, so the line
# this paragraph draws is one only the fallbacks still hold. The two reasons below are
# kept because they are why shipping crossed first, and they apply again the moment
# that variable is deleted. Both are about the deploy rather than about the budget. A deploy
# must not queue behind an agent's twenty-minute browser suite, because the slot it is
# waiting for is the slot that decides how long production stays on the old bundle.
# And a deploy has to work when the local machine does not - the note this replaces
# said as much about `vars.RUNNER_CI` being the recovery path for shipping, which made
# recovery a variable somebody has to remember to set, under exactly the conditions
# that make it hard to remember. Running there by default retires that lever.
#
# It fits, and the premise is written down because it is plan-dependent and has already
# been wrong once. Verified 2026-09-17 in the organisation's billing page: GitHub Team,
# 3,000 Actions minutes included, 0 used. Measured over the 30 days to the same date the
# deploy jobs across both repositories cost ~850 min of pool time, which is ~1,900
# GitHub-hosted minutes at the ~2.2x a 2-core hosted runner costs against these
# containers - inside the 3,000, with room left for a failover. On GitHub Free the
# allowance is 2,000 and this no longer fits; if the organisation is ever downgraded,
# set `RUNNER_DEPLOY` back to the pool before the next deploy.
#
# That headroom is no longer the deploy's alone. Since 2026-09-21 `RUNNER_CI` is set to
# `["ubuntu-latest"]` on this repository, so its whole gate bills against the same 3,000.
# Measured the same day: 373 Actions minutes used across the organisation in September,
# 94 of them this repository, back when only deploys ran hosted. Then measured on both
# sides of the move, one pull request's two heavy jobs: `generated · typecheck · lint ·
# build` 1m26s on the pool against 1m54s hosted, and `unit tests · coverage` 2m25s
# against 5m45s. That is 1.99x overall, so the 2.2x above was close - but the spread
# matters more than the average, because the CPU-bound suite carries 2.38x of it and the
# other job only 1.33x. Eight billable minutes for the pair, Actions rounding each job up
# to the minute; call it nine a push with the gates, before `a11y` and `claude-review`
# and before the browser suites that run on the push to the base branch rather than on a
# pull request. Read the real monthly rate off the billing page after a full week, and if
# it does not fit, `gh variable delete RUNNER_CI` is the whole reversal.
#
# `RUNNER_DEPLOY` set to `["self-hosted","linux","ARM64","ci"]` puts shipping back on
# the pool without a pull request, which is the same escape hatch in the other
# direction. See design4pro/cezar, `docs/host/README.md`, "The runner pool".

jobs:
  deploy:
    name: Migrate and deploy to staging
    runs-on: ${{ fromJSON(vars.RUNNER_DEPLOY || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    # Never run two deploys at once, and never cancel one half-way: an interrupted
    # `d1 migrations apply` would leave the schema between two versions. On the job, so it holds
    # the same way whether ci.yml calls this or a human dispatches it.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.money-tracker.online

    env:
      CI: 'true'
      # `vars` resolves environment-level values over repository-level ones, so the `staging`
      # GitHub Environment can override these with the Polar sandbox product ids.
      VITE_POLAR_PRODUCT_PLUS_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_PLUS_MONTHLY }}
      VITE_POLAR_PRODUCT_PLUS_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_PLUS_YEARLY }}
      VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY }}
      VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY }}
      # The DSN is public by construction - it ships in the client bundle - so it is a variable,
      # while the token that uploads source maps is a secret. VITE_ENVIRONMENT mirrors the
      # ENVIRONMENT var the Worker reads from wrangler.jsonc, because the browser cannot read a
      # Worker var. VITE_SENTRY_RELEASE is read by both bundles, so one deploy is one Sentry
      # release rather than two halves nothing relates.
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_ENVIRONMENT: staging
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

    steps:
      # The `secrets` context is not available in a job-level `if`, so the gate is a first step: a
      # fork or a freshly cloned repo without Cloudflare credentials reports a warning and skips,
      # instead of failing red on a deploy it was never going to be able to make.
      - name: Check the deploy credentials are configured
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=Deploy skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up the toolchain
        if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup

      - name: Generate the route tree
        if: steps.gate.outputs.configured == 'true'
        run: pnpm generate-routes

      # The environment is chosen at BUILD time, not at deploy time. The Cloudflare Vite plugin
      # flattens the selected env of wrangler.jsonc into dist/server/wrangler.json and writes a
      # .wrangler/deploy/config.json redirect pointing at it, and `wrangler deploy` below follows
      # that redirect.
      #
      # Which is why the deploy step carries no `--env staging`: the flattened config it is
      # handed IS the staging Worker and has no `env` block left in it, so `--env staging` there
      # fails with "no environment found". The migrate step is the one command that needs the
      # flag, because it reads wrangler.jsonc directly and never sees the redirect.
      - name: Build (staging environment)
        if: steps.gate.outputs.configured == 'true'
        run: CLOUDFLARE_ENV=staging pnpm build

      # Cheap insurance against the silent-production gotcha: a build that ran without
      # CLOUDFLARE_ENV emits the production config, and a deploy from it would overwrite
      # production from the develop branch. Refuse to continue unless the emitted config is the
      # staging Worker.
      - name: Verify the emitted config targets staging
        if: steps.gate.outputs.configured == 'true'
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const c = JSON.parse(readFileSync('./dist/server/wrangler.json', 'utf8'));
            if (c.name !== 'money-tracker-staging') {
              console.error('emitted config is ' + c.name + ', refusing to deploy');
              process.exit(1);
            }
            console.log('emitted config: ' + c.name);
          "

      # Migrations run BEFORE the deploy, and that ordering is a policy with a cost attached:
      # between this step and the next, the currently-running Worker - the previous version of
      # the code - is serving against the NEW schema. Every migration must therefore be additive
      # (add tables, add nullable columns, add indexes) and never remove or narrow anything the
      # deployed code still reads. A destructive change is a two-release dance: release one stops
      # using the column, release two drops it. CI's db-drift rung proves a migration exists; only
      # review proves it is additive.
      - name: Apply D1 migrations
        if: steps.gate.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # Keep in step with the `wrangler` devDependency in package.json.
          wranglerVersion: '4.70.0'
          command: d1 migrations apply money-tracker-db-staging --remote --env staging

      - name: Deploy Worker
        if: steps.gate.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4.70.0'
          command: deploy

      # Proof that the new version is actually serving, and the cheapest one there is: /api/health
      # boots the Worker and reads the version metadata binding in a single request. The script
      # asserts the status code exactly rather than leaning on `curl --fail`, so a 302 to a login
      # page or an error page served with 200 is not mistaken for success, and it separates a
      # Worker that answered badly - worth the retry loop, because a new version takes a few
      # seconds to become globally routable - from Cloudflare's own edge answering in its place,
      # which no amount of retrying will fix.
      #
      # staging.money-tracker.online carries no Access application, so this check sends no
      # credentials. It did need Bot Fight Mode turned off: it was on zone-wide and challenged the
      # runner's IP on all ten attempts, and the Free plan has no rule that could exempt it.
      - name: Smoke-check the deployment
        if: steps.gate.outputs.configured == 'true'
        run: bash scripts/smoke-check.sh https://staging.money-tracker.online/api/health
