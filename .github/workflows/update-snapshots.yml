name: Update e2e baselines

# Re-records the `-linux` screenshot baselines in the same container image the
# gate compares them in, and opens a pull request with the result.
#
# The name is load-bearing: `playwright.config.ts` cites this workflow by it as
# the thing that produces `-linux`, and `e2e/support/visual.ts` cites it in the
# reason it skips frames off Linux. A rename here makes both comments lie.
#
# `pnpm sandcastle:baselines` does the same job on a developer's machine, in the
# same image, without spending Actions minutes. This exists for the case that
# has no sandbox behind it - a design change landed by someone not running the
# loop - and because a config that names a workflow ought to be pointing at one.
#
# `workflow_dispatch` only. Recording is never automatic: a baseline refresh is
# how a visual regression gets laundered into the repository, so it takes a
# person deciding to run it and a reviewer looking at the PNGs afterwards.

on:
  workflow_dispatch:
    inputs:
      project:
        description: >
          Which project to re-record. `both` is almost always right - a design
          change moves the desktop and the phone layout together.
        required: false
        default: both
        type: choice
        options: [both, chromium, mobile-safari]

concurrency:
  group: update-snapshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  CI: 'true'
  VITE_POLAR_PRODUCT_PLUS_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_PLUS_MONTHLY }}
  VITE_POLAR_PRODUCT_PLUS_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_PLUS_YEARLY }}
  VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY }}
  VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  VITE_ENVIRONMENT: ci

jobs:
  record:
    name: record · ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same image as ci.yml's `e2e` job, and that is the whole point of this
    # workflow: the pixels it writes are the pixels the gate will compare. Keep
    # the tag in step with the `@playwright/test` devDependency and with ci.yml.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Prepare the browser-test environment
        uses: ./.github/actions/e2e-env

      # Scoped to `e2e/visual.spec.ts`, which is the only file that owns
      # baselines. Running the whole suite under `--update-snapshots` would let
      # a red functional spec abort a recording that had nothing to do with it.
      #
      # `--reporter=line` because the HTML reporter's value here is the diff
      # view, and a recording run produces no diffs - it produces the new truth.
      - name: Re-record the baselines
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3010
          PROJECTS: >-
            ${{ inputs.project == 'both'
            && '--project=chromium --project=mobile-safari'
            || format('--project={0}', inputs.project) }}
        run: >-
          pnpm exec playwright test e2e/visual.spec.ts $PROJECTS
          --update-snapshots --reporter=line

      - name: Upload the dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-snapshots-dev-server-log
          path: dev-server.log
          retention-days: 3
          if-no-files-found: ignore

      # A pull request rather than a push to the branch: a baseline refresh is
      # exactly the change that must not land unlooked-at, because a real
      # regression and an intended redesign are byte-for-byte the same kind of
      # diff. The reviewer looking at the PNGs is the gate, not this workflow.
      - name: Open a pull request with the new baselines
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: e2e/__screenshots__
          branch: chore/update-e2e-baselines
          delete-branch: true
          commit-message: >-
            test(e2e): re-record the -linux baselines
          title: 'test(e2e): re-record the `-linux` baselines'
          body: |
            Re-recorded by the **Update e2e baselines** workflow, in
            `mcr.microsoft.com/playwright:v1.62.1-noble` - the image `ci.yml`'s
            `e2e` job compares them in.

            Projects: `${{ inputs.project }}`. Ref: `${{ github.ref_name }}`.

            **Look at the images before approving.** An intended redesign and a
            visual regression produce the same shape of diff, and this workflow
            cannot tell them apart. Anything here that you did not expect to
            move is the bug this gate exists to catch.
