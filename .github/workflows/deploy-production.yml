name: Deploy production

# Git Flow's release leg: a push to `main` migrates and deploys the production Worker.
#
# The job is bound to the GitHub Environment named `production`, which is where the manual
# approval lives: configure that environment with required reviewers and this workflow parks at
# "Waiting for review" until a human approves it. Without reviewers configured the environment is
# a no-op and pushes deploy straight through - so setting them is part of the first-provision
# runbook, not an optional hardening step.
#
# ── GitHub configuration this workflow needs ──────────────────────────────────────────────────
# secrets    CLOUDFLARE_API_TOKEN   Workers Scripts:Edit + D1:Edit on account 6cfdf3b5143cddc631383a4c14736c3a
#            CLOUDFLARE_ACCOUNT_ID  6cfdf3b5143cddc631383a4c14736c3a
#            SENTRY_AUTH_TOKEN      optional; without it no source maps are uploaded
#            CF_ACCESS_CLIENT_ID    Cloudflare Access service token; money-tracker.online is behind
#            CF_ACCESS_CLIENT_SECRET  Access and answers an unauthenticated smoke check with a 302
#                                   to the team login. Needs a Service Auth policy on the app.
# variables  VITE_POLAR_PRODUCT_PLUS_MONTHLY, VITE_POLAR_PRODUCT_PLUS_YEARLY,
#            VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY, VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY,
#            VITE_SENTRY_DSN, SENTRY_ORG, SENTRY_PROJECT
#
# The Worker's own runtime secrets are NOT set here. They live in Cloudflare, put there once with
# `wrangler secret put <NAME>`, and a deploy neither reads nor replaces them.
# ──────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one half-way: an interrupted
# `d1 migrations apply` would leave the schema between two versions.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The approval gate. Nothing in the job runs until the environment's reviewers approve, so
    # the credentials below are never handed to a run nobody looked at.
    environment:
      name: production
      url: https://money-tracker.online

    env:
      CI: 'true'
      # Production Polar product ids, inlined into both bundles at build time. Same four
      # repository variables staging reads; the `staging` environment overrides them with the
      # sandbox ids, and this job takes the repository-level ones.
      VITE_POLAR_PRODUCT_PLUS_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_PLUS_MONTHLY }}
      VITE_POLAR_PRODUCT_PLUS_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_PLUS_YEARLY }}
      VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY }}
      VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_ENVIRONMENT: production
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

    steps:
      # The `secrets` context is not available in a job-level `if`, so the gate is a first step.
      - name: Check the deploy credentials are configured
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=Deploy skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Set up the toolchain
        if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup

      - name: Generate the route tree
        if: steps.gate.outputs.configured == 'true'
        run: pnpm generate-routes

      # No CLOUDFLARE_ENV, so the plugin flattens the top-level (production) environment into
      # dist/server/wrangler.json and `wrangler deploy` below follows the redirect to it.
      - name: Build
        if: steps.gate.outputs.configured == 'true'
        run: pnpm build

      # The mirror of staging's guard: refuse if the emitted config is anything but the
      # production Worker. A stray CLOUDFLARE_ENV in the environment would otherwise deploy
      # staging's config over the production name.
      - name: Verify the emitted config targets production
        if: steps.gate.outputs.configured == 'true'
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const c = JSON.parse(readFileSync('./dist/server/wrangler.json', 'utf8'));
            if (c.name !== 'money-tracker') {
              console.error('emitted config is ' + c.name + ', refusing to deploy');
              process.exit(1);
            }
            console.log('emitted config: ' + c.name);
          "

      # Migrations run BEFORE the deploy, and that ordering is a policy with a cost attached:
      # between this step and the next, the currently-running Worker - the previous version of
      # the code - is serving live traffic against the NEW schema. Every migration must therefore
      # be additive (add tables, add nullable columns, add indexes) and never remove or narrow
      # anything the deployed code still reads. A destructive change is a two-release dance:
      # release one stops using the column, release two drops it. CI's db-drift rung proves a
      # migration exists; only review proves it is additive.
      - name: Apply D1 migrations
        if: steps.gate.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # Keep in step with the `wrangler` devDependency in package.json.
          wranglerVersion: '4.70.0'
          command: d1 migrations apply money-tracker-db --remote

      - name: Deploy Worker
        if: steps.gate.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4.70.0'
          command: deploy

      # Proof that the new version is actually serving: /api/health boots the Worker and reads the
      # version metadata binding in a single request. The script asserts the status code exactly
      # rather than leaning on `curl --fail`, so an error page served with 200 or a redirect is
      # not mistaken for success, and it separates a Worker that answered badly - worth the retry
      # loop, because a new version takes a few seconds to become globally routable - from
      # Cloudflare's own edge answering in its place, which no amount of retrying will fix. See
      # scripts/smoke-check.sh for both credentials.
      - name: Smoke-check the deployment
        if: steps.gate.outputs.configured == 'true'
        env:
          # money-tracker.online sits behind Cloudflare Access, which answers an
          # unauthenticated request with a 302 to the team login - the Worker
          # never sees it. This service token is what gets the check through. It
          # is admitted by the `money-tracker.online smoke check` Access
          # application, whose single destination is money-tracker.online
          # /api/health and whose only policy is Service Auth naming the
          # `money-tracker-smoke-production` token - so the token reaches the
          # health endpoint and nothing else on the domain.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/smoke-check.sh https://money-tracker.online/api/health
