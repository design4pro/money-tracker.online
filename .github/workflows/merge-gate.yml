name: Merge gate

# Required check for risk, QA and hard-block policy.
#
# `labeled` and `unlabeled` refresh the decision after a policy change without a push.
#
# `merge_group` is here so the check reports where a merge queue requires it. A queue builds its own
# commit and waits for every required check on it; a workflow with no trigger for that event never
# reports one, so the entry waits out `check_response_timeout_minutes` and is dropped. The job below
# then skips itself, and a skipped job reports success - which is the honest answer, because what
# this gate reads (the labels, on the pull request) is not in a merge group payload.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, converted_to_draft, edited]
    branches: [develop, main]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  merge_group:
    types: [checks_requested]

# The workflow and deciding script come from the default branch. The job reads metadata only
# and never checks out or executes code from the pull request.
permissions: {}

# A label flip fires this while the previous run is still starting, and without cancellation the
# older of the two can report last - leaving a green check on a pull request somebody just marked
# `blocked`. Cancelling means the newest label state is always the one that reports.
#
# A merge group carries no pull request number, so without the fallback every queue run would share
# the group `merge-gate-` and cancel the one before it - and a cancelled required check is how the
# queue learns to drop an entry. `run_id` is unique per run, so those runs cancel nothing.
concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The job id and the job name are both `merge-gate` because that string is the check context a
  # ruleset's `required_status_checks` names. Renaming either un-requires the check silently: a
  # ruleset entry matching no check is not an error, it is simply never waited for.
  merge-gate:
    name: merge-gate
    # Only a pull request has labels to read. In a merge group this skips, and a skipped job is a
    # passing required check - the gate already had its say when the pull request was enqueued.
    # What that costs: a hard-block label added while the pull request sits in the queue is not
    # read. Taking it out of the queue is what stops it then, not the label.
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","ARM64","ci"]') }}
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      # A required check must not execute policy supplied by the pull request it judges.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: scripts/ci

      - name: Enforce the current pull request policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RISK_APPROVERS: ${{ vars.RISK_APPROVERS }}
          QA_APPROVERS: ${{ vars.QA_APPROVERS }}
        run: node scripts/ci/merge-gate.mjs
