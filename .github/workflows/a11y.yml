name: Accessibility

# On-demand axe scan. Pull-request verification no longer runs here (ADR 0033): Cursor cloud
# agents run `pnpm exec tsx .github/a11y/axe-scan.mjs` on their VM and post the result on the PR.
# Dispatch this workflow when a person wants the same scan on the VPS pool without opening a PR.
#
# ── GitHub configuration this workflow needs ──────────────────────────────────────────────────
# secrets    E2E_USER_PASSWORD  optional; only if the seed's demo password is not the default
# variables  E2E_USER_EMAIL     optional; only if the seed's demo address is not the default
# ──────────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  axe:
    name: axe · WCAG 2.2 AA gate
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 30

    env:
      CI: 'true'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Prepare the browser-test environment
        uses: ./.github/actions/e2e-env

      - name: Run the accessibility scan
        env:
          A11Y_BASE_URL: http://localhost:3010
          A11Y_OUT_DIR: a11y-report
          A11Y_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
          A11Y_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: pnpm exec tsx .github/a11y/axe-scan.mjs

      - name: Upload the axe results
        if: always()
        continue-on-error: true
        uses: design4pro/.github/actions/artifact-upload@main
        with:
          name: a11y-axe-results
          path: a11y-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the dev server log
        if: failure()
        uses: design4pro/.github/actions/artifact-upload@main
        with:
          name: a11y-dev-server-log
          path: dev-server.log
          retention-days: 3
          if-no-files-found: ignore
