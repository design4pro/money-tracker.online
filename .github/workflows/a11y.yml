name: Accessibility

# The accessibility gate, and the one place the product's two different promises are kept
# apart:
#
#   * WCAG 2.2 level A and AA are a HARD gate. Any axe violation on any scanned route, in either
#     colour scheme, fails this workflow and therefore the merge.
#
#   * A named list of AAA criteria - 2.5.5 target size (44px), 2.4.11/2.4.12 focus not obscured,
#     1.4.8 visual presentation, 2.2.6 timeouts, 3.3.9 accessible authentication, plus axe's own
#     AAA rules including 1.4.6 enhanced contrast at 7:1 - is measured and reported, and does not
#     fail the build.
#
# That second bucket is a commitment, not a certification. Nothing here licenses a blanket
# "WCAG 2.2 AAA compliant" claim in user-facing or marketing copy, and the report says so.
#
# The scanner and its route list live in .github/a11y/. The route list is meant to track the
# visual specs under e2e/visual/: a route worth photographing is a route worth scanning.
#
# ── GitHub configuration this workflow needs ──────────────────────────────────────────────────
# secrets    E2E_USER_PASSWORD  optional; only if the seed's demo password is not the default
# variables  E2E_USER_EMAIL     optional; only if the seed's demo address is not the default
# ──────────────────────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  axe:
    name: axe · WCAG 2.2 AA gate
    # A develop→main pull request duplicates the push-triggered run on the same commits; the push
    # run is canonical for the shared branches.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same image as the e2e gate, and for the same reason: the browsers are already in it, and
    # font rasterisation - which is what axe's contrast rule samples - is a property of the
    # platform. A scan on a different base would disagree about borderline ratios.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    env:
      CI: 'true'

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Prepare the browser-test environment
        uses: ./.github/actions/e2e-env

      # Two passes over every route in .github/a11y/routes.json: the A/AA gate at desktop width
      # in both colour schemes, then the AAA advisory pass at mobile width. Exit 1 means an A/AA
      # violation, exit 2 means the scan could not run at all - a lost session, a route that
      # answered 500 - which is a failure of the gate, not a pass.
      - name: Run the accessibility scan
        env:
          A11Y_BASE_URL: http://localhost:3010
          A11Y_OUT_DIR: a11y-report
          # Both are optional. Unset, the scanner uses the demo account the seed writes; they
          # exist so a checkout whose seed uses different credentials does not have to fork the
          # scanner to say so.
          A11Y_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
          A11Y_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: node .github/a11y/axe-scan.mjs

      # `always()`: the JSON is at its most useful on the run that failed.
      - name: Upload the axe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-axe-results
          path: a11y-report
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload the dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-dev-server-log
          path: dev-server.log
          retention-days: 3
          if-no-files-found: ignore
