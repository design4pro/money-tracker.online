name: Promote develop

# Git Flow's promotion leg, kept open automatically: after every push to `develop` - which is
# every merge into staging - this opens the `develop` → `main` pull request if one is not already
# open, and otherwise leaves the existing one alone. It never merges anything; the owner
# reviews and merges it, and merging is what deploys production (ci.yml's `deploy · production`, behind
# a green CI run on `main`).
#
# ADR 0003 names the drift between the two long-lived branches as the cost of this flow, and
# cadence as the only mitigation. A promotion pull request that always exists is what makes the
# cadence visible: the diff to production is on screen from the first merge into staging.
#
# ── The token, and why there are two ──────────────────────────────────────────────────────────
# A pull request opened with the default GITHUB_TOKEN does not trigger `pull_request` workflows,
# so it shows no checks of its own. Set the repository secret `PROMOTE_PR_TOKEN` - a fine-grained
# PAT or a GitHub App installation token with `contents: read` and `pull requests: write` on this
# repository - and the promotion pull request runs ci.yml and a11y.yml like any other.
#
# Without that secret the expression below falls back to GITHUB_TOKEN and the workflow still
# works; only the checks are missing. That is survivable, because ci.yml and a11y.yml also run
# `on: push: branches: [main, develop]`, so the exact commit being promoted has already been
# through the full gate on `develop`.
#
# ── The label, and why the promotion opens carrying one ───────────────────────────────────────
# Because PROMOTE_PR_TOKEN belongs to a maintainer, this pull request is indistinguishable, to the
# cezar poller, from one that maintainer opened by hand: `pr-autopilot`
# (docs/agents/cezar-automations.json) filters `pull_request.opened` by author and reads no base
# branch. Every promotion therefore started a full agent run on a pull request the skill can do
# nothing useful with - it carries no change of its own, is not the automation's to fix, and merging it deploys production,
# which the skill must never do. Observed on #148, #153, #188 and #193, each claimed within minutes
# of opening; #193 spent roughly twenty of them re-reviewing an already-reviewed diff and then
# labelled itself `merge-queue` - the very label that, applied at creation, would have stood the
# run down (design4pro/planned.travel#380).
#
# `--label merge-queue` below is that stand-down, and it is the honest label rather than a
# convenient one: SDLC.md calls `merge-queue` routing rather than proof of QA, and "green, waiting
# on a human" is what a promotion pull request is from the moment it opens. It silences nothing
# else. Labelling a pull request goes through the issues endpoint, which GitHub grants to
# `pull requests: write` as well as to `issues: write`, so it is covered by the permission this
# token already needs to open the pull request at all, and by the job's `permissions:` block on the
# GITHUB_TOKEN fallback path. Neither path needs a permission widened for it.
#
# `--label promotion` is what keeps the pipeline's own merge away from it. Every pull request
# here - agent or human, this one included - is authored by the owner's one account, and the
# pipeline merges into `develop` on its own (ADR 0027, amended 2026-10-01), so neither the author
# nor `merge-queue` tells the release apart. Every cezar PR automation excludes `promotion`, and
# the merge skills merge unattended only into `develop`. The label already exists in the
# repository (creating one would need `issues: write`); an already open promotion gets it too.
# ──────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [develop]
  workflow_dispatch:

# One at a time: two pushes landing together must not race into two duplicate pull requests.
concurrency:
  group: promote-develop
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

# `runs-on` below reads through `vars.RUNNER_CI`, unset on this repository, so this job runs on
# the `ci` pool the fallback array names: x64 containers on the OVH VPS (ADR 0022, ADR 0027).
# Setting the variable (`gh variable set RUNNER_CI '["ubuntu-latest"]'`) moves every job that
# reads it off the VPS without a pull request; deploys follow `vars.RUNNER_DEPLOY`
# (deploy-production.yml). These are variables and not literal label arrays because reverting by
# pull request would need the required checks, which need the runners that are missing. See
# design4pro/cezar, `docs/host/README.md`, "Linux host".

jobs:
  promote:
    name: Open the develop → main pull request
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open it, or report the one already open
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            # REST, not `gh pr edit`: that one also queries the retired Projects (classic) API and
            # fails on some gh versions, which under `set -e` would fail the whole job.
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${existing}/labels" -f 'labels[]=promotion' > /dev/null
            echo "::notice title=Promotion pull request::#${existing} is already open and now carries this commit."
            exit 0
          fi

          # `main` is an ancestor of `develop` when there is nothing to promote - a just-merged
          # promotion, or a fresh repo. `gh pr create` would fail red on that; it is not a failure.
          if [ -z "$(git log --oneline origin/main..origin/develop)" ]; then
            echo '::notice title=Nothing to promote::develop carries no commits main does not have.'
            exit 0
          fi

          body=$(printf '%s\n' \
            'Automated promotion pull request, opened by `.github/workflows/promote-develop.yml`.' \
            '' \
            '> [!IMPORTANT]' \
            '> **Merge this with a merge commit** - "Create a merge commit", or' \
            '> `gh pr merge --merge`. Never squash and never rebase.' \
            '>' \
            '> The second parent is the only thing that tells `main` it already contains what' \
            '> `develop` contains. A squash writes the content onto `main` under a commit with no' \
            '> ancestral link to what it flattened, so the next promotion re-proposes these same' \
            '> commits - see ADR 0003, amendment 2026-09-09.' \
            '' \
            'Merging this deploys **production**. It stays open and keeps collecting commits until the' \
            'owner merges it, so the diff between staging and production is always one click away.' \
            '' \
            'Before merging, check that staging has actually been exercised:' \
            '<https://staging.money-tracker.online>.' \
            '' \
            'Every commit below has already passed the full gate on `develop`. Whether this pull' \
            'request also runs its own checks depends on the token that opened it - see the header of' \
            '`.github/workflows/promote-develop.yml`.')

          gh pr create \
            --base main \
            --head develop \
            --title 'chore(release): promote develop to main' \
            --label merge-queue \
            --label promotion \
            --body "$body"
