name: Claude Code Review

on:
  pull_request:
    # `unlabeled` is here only for the re-arm job at the bottom; the review itself skips it.
    types: [opened, synchronize, ready_for_review, reopened, unlabeled]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # A label change is not a code change, and re-reviewing on one would spend a full run to reach
    # the same conclusion. Only the re-arm job below cares about `unlabeled`.
    if: github.event.action != 'unlabeled'

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    # The agent pool, for the reason spelled out at "Run Claude Code Review" below: this job is
    # only safe to run with `bypassPermissions` because the runner does not outlive it.
    runs-on: ${{ fromJSON(vars.RUNNER_AGENT || '["self-hosted","linux","ARM64","agent"]') }}
    permissions:
      contents: read
      # The action authenticates as this job's GITHUB_TOKEN, so `read` here made both channels the
      # review is asked to publish through - `gh pr comment` and the inline-comment MCP server -
      # a 403 it would only discover after spending the whole review. Nothing else is widened.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      # The `secrets` context is not available in a job-level `if`, so the gate is a first step -
      # the same shape deploy.yml uses for its Cloudflare credentials.
      #
      # Without it a missing or expired token fails this job in under half a second, with zero
      # turns and zero cost, and the review that never ran looks exactly like a review that found
      # something. It had been red on every branch in the workflow's recorded history, which is
      # how a check stops being read at all.
      - name: Check the review credentials are configured
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is unset - skipping the automated review."
            echo "::warning::Generate one with \`claude setup-token\` and set it as a repository secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # One rule, written out once here because this job is two of the three places that have to
      # follow it: nothing the branch under review supplies may judge that branch or run with a
      # write token. The checkout above is the pull request's own merge commit, so this step takes
      # back from the base branch everything the branch would otherwise be supplying to itself -
      # `.claude/hooks` and the `.claude/settings.json` that registers them, which are the gate the
      # step below hands the review to, and `scripts/ci`, whose scripts three later steps run, the
      # last of them on `github.token` under this job's `pull-requests: write` (#103). The third
      # place is `rearm-review-threads`, which checks the base ref out wholesale for the same
      # reason.
      #
      # `.ai/agentic.config.json` is here because review-threads-label.mjs reads `baseBranch` out
      # of it to decide whether the pull request is in this automation's scope at all. Left to the
      # branch under review, that decision would be the branch's to make: a pull request into the
      # default branch could restate `baseBranch` as the default branch in its own tree and arm a
      # run on itself, which is the very door the guard closes. Taking the script from the base
      # branch and its scope from the pull request would have been half a guard.
      #
      # A path the pull request *adds* under those trees survives this checkout - it restores, it
      # does not clean. Harmless while every step names the script it runs; not harmless the moment
      # one globs.
      - name: Take the agent hooks and the CI scripts from the base branch
        if: steps.gate.outputs.configured == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --depth 1 origin "$BASE"
          git checkout FETCH_HEAD -- .claude/settings.json .claude/hooks scripts/ci .ai/agentic.config.json

      # `continue-on-error`, because the two steps that follow decide what the outcome meant: a
      # spent usage limit reviewed nothing and is not a finding, a review that was denied its tools
      # reviewed nothing either and must not pass as one.
      #
      # A second allowlist here was the wrong shape twice over. `--allowedTools` is the whole list,
      # not an addition to a default (the action injects none), and every tool the plugin or its
      # subagents reach for has to be predicted in advance: naming the inline-comment tool alone
      # denied the first `gh pr view` and ended a run in eighteen seconds, green, and the widened
      # list that replaced it still missed one `gh api` read and produced a review that invented
      # its own findings. So the list stops gating: `bypassPermissions` lifts it, and the single
      # gate becomes `git-guardrails.sh`, which enumerates what is forbidden rather than what is
      # foreseen, and still blocks with exit 2 in this mode. The runner is disposable, and the only
      # surface the token can write to is the pull request the hook narrows to a single comment.
      #
      # "Disposable" stopped being a property of the platform when this moved to the host pool, so
      # it is now a property of two lines in host/runner: the runner registers with `--ephemeral`,
      # so GitHub hands it one job and deregisters it, and the container is recreated from an
      # unmodified image before the next. The agent pool mounts no shared volume, so unlike the ci
      # pool there is not even a package store for a run to leave something in. If this job is ever
      # pointed at a runner that outlives it, the argument above has to be made again from the
      # start - it is the only thing standing between `bypassPermissions` and a persistent host.
      #
      # `--allowedTools` survives for one unrelated job: in agent mode the action installs an MCP
      # server only when a matching tool name appears there (src/mcp/install-mcp-server.ts), so
      # dropping the flag would take the inline-comment tool away entirely.
      - name: Run Claude Code Review
        id: claude-review
        if: steps.gate.outputs.configured == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          # Unblocks `gh pr comment` in git-guardrails.sh, and nothing else.
          CLAUDE_REVIEW_PR_COMMENT: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The trailing instruction is load-bearing, not decoration. The plugin spawns its
          # reading agents with `Agent`, and in run 33895385603 it backgrounded them: it said
          # "I'll wait for the background agent's notification" and the session ended thirteen
          # seconds later with the eligibility check still running. A non-interactive run has no
          # waiting - ending a turn ends the run - so a backgrounded agent is one whose findings
          # nobody ever reads. `claude-review-ran.mjs` now fails a run that ends with a subagent
          # still working, and this is the half that stops it happening.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Spawn every subagent in the foreground, with `run_in_background: false`. This run is
            non-interactive: when you end your turn the session ends, so there is nothing to wait
            with and a backgrounded agent's findings reach nobody.

          # The repository is private, so the transcript this prints is already as visible as the
          # diff it quotes - and without it a crippled review leaves nothing in the log to read.
          show_full_output: true
          claude_args: >-
            --permission-mode bypassPermissions
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # A skipped step's outcome is `skipped`, so the credential gate above still short-circuits
      # this one.
      - name: Treat an exhausted Claude limit as a skipped review
        if: always() && steps.claude-review.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: node scripts/ci/claude-usage-limit.mjs

      # The other half of the same job: the step above catches a review that failed, this one
      # catches a review that succeeded without reviewing. Only one of the two ever runs.
      #
      # Neither is a formality on a pull request that edits this file. This comment used to say
      # such a pull request "never reaches either", because the action's OIDC exchange refuses a
      # workflow differing from the default-branch copy and the gate then reports "a warning rather
      # than a failure". Both halves are wrong, and each was disproved separately:
      #
      #   - planned.travel run 34860285502 reviewed a branch whose copy of this file differed from
      #     `main` by 24 lines. The review ran, read the pull request, and passed this step.
      #   - `claude-usage-limit.mjs` sends a missing or unreadable execution file through `fail()`,
      #     never `pass()`. An absent review is a red job on purpose - its header says why: "A wrong
      #     green here is far more expensive than a wrong red".
      #
      # So a red `claude-review` on a workflow-editing pull request is a result, not an artefact of
      # editing the workflow. Nor does `runs-on` wait for `main`: GitHub evaluates it when the job
      # is scheduled, long before any action runs, so a change of runner target is exercised in full
      # on the branch proposing it - which is how kit 35 found the tooling its new self-hosted agent
      # pool was missing.
      - name: Fail a review that never read the pull request
        if: steps.claude-review.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: node scripts/ci/claude-review-ran.mjs

      # The threads this job leaves are what the `develop` ruleset holds the merge on, and nothing
      # resolves them by itself - until now a maintainer cleared them by running `om-auto-fix-pr` by
      # hand. This step applies `review-threads`, and the cezar automation of that name turns the
      # label into the run (docs/agents/cezar.md). The label is the signal because cezar 0.10.1 has
      # no automation event for a review.
      #
      # `always()`: a review that tripped either guard above may still have left threads behind, and
      # threads from an earlier head hold the merge whatever this run did. The script is where the
      # judgement lives - it arms only for live, non-outdated threads opened by the review bot, and
      # only once per head - so the step condition stays deliberately blunt.
      #
      # `github.token` is enough: the consumer is cezar's poller, which reads the issues API, and
      # GitHub emits no workflow-triggering events for actions taken with GITHUB_TOKEN - the same
      # reasoning as the Sentry sweep in sentry-triage.yml.
      - name: Arm the review-thread autofix when threads are left open
        if: always() && steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/review-threads-label.mjs

  # The step above always ran while a claim was held, and so never armed anything.
  #
  # `pr-autopilot` fires on `pull_request.opened` and takes `in-progress` within a minute; the
  # review job needs five to eight. So by the time it asks, `in-progress` is there - and the script
  # treats it as "a run already owns this PR and will handle its threads". It does not: that run
  # can leave a thread open and then drop the claim, and nothing re-asks, because the review job
  # only runs on a code event and a finished pull request gets no further push. Measured on
  # #320, #321 and #322: three for three, `not arming - the PR carries in-progress`, and zero
  # `pr-fix` runs in the whole recorded history of the cockpit.
  #
  # So ask again when the claim comes off. Same script, same head-keyed marker, same decision -
  # only the moment is new, and it is the first moment the answer can be anything but "held".
  rearm-review-threads:
    if: github.event.action == 'unlabeled' && github.event.label.name == 'in-progress'
    # The ci pool, not the agent pool: this job runs one repository script and spends no tokens.
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","ARM64","ci"]') }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base branch, never the pull request's own tree: this job runs a repository script with
      # a write token, and the branch under review must not be the one that supplies it. Same
      # reasoning as "Take the agent hooks and the CI scripts from the base branch" above.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Re-arm the review-thread autofix now the claim is released
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/review-threads-label.mjs
