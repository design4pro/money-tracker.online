name: Claude Code Review

# An automated review on every pull request, and - more importantly - a check that stays readable.
#
# Two ways this job can be red without a reviewer having found anything, and both are handled here
# rather than left to whoever looks at the pull-request page:
#
#   * The credential is missing or expired. The action then fails in under half a second, with zero
#     turns and zero cost, and the review that never ran looks exactly like a review that found
#     something.
#   * The subscription's limit is spent. The action reports a `result` message carrying the limit
#     text and `is_error: true`, which it turns into a failed step without asking why.
#
# A check that is red for reasons unrelated to the diff stops being read at all, and a check
# nobody reads is worse than no check: the page still shows one.
#
# This is not the `@claude` mention path and must not be confused with it. `scripts/agent/cez-lib.sh`
# neutralises `@claude` in everything a Cezar run writes to GitHub precisely so a run cannot summon
# an action; this workflow is triggered by the pull-request event instead, which no run controls.
#
# ── GitHub configuration this workflow needs ──────────────────────────────────────────────────
# secrets    CLAUDE_CODE_OAUTH_TOKEN  optional; without it the job is a no-op with a warning
# ──────────────────────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    name: Claude · review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # The `secrets` context is not available in a job-level `if`, so the gate is a first step -
      # the same shape deploy-production.yml uses for its Cloudflare credentials.
      - name: Check the review credentials are configured
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is unset - skipping the automated review."
            echo "::warning::Generate one with \`claude setup-token\` and set it as a repository secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # `continue-on-error`, because the step that follows decides what the failure meant: a spent
      # usage limit reviewed nothing and is not a finding, anything else still fails the job.
      - name: Run Claude Code Review
        id: claude-review
        if: steps.gate.outputs.configured == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      # A skipped step's outcome is `skipped`, so the credential gate above still short-circuits
      # this one.
      - name: Treat an exhausted Claude limit as a skipped review
        if: always() && steps.claude-review.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: node scripts/ci/claude-usage-limit.mjs
