name: Claude

# Interactive mode: no `prompt` input, so Claude waits to be addressed rather
# than running on its own. Mention @claude in an issue, in a comment on one, or
# in a pull request review and it picks the work up from there, pushes to a
# `claude/`-prefixed branch and opens a pull request against it.
#
# This runs on the host runner pool, not on the Anthropic cloud VM that
# `claude --cloud` uses. The practical difference is that everything the job
# needs has to be installed here, and that CI on the resulting branch is the
# same CI as for any other branch.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One conversation at a time per issue or pull request: two runs answering the
# same thread would push over each other's commits.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Keeps a runner from starting on the overwhelming majority of comments,
    # which are people talking to each other. The action checks the trigger
    # phrase again itself before it answers.
    if: >
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    # A machine that takes this one job and is then destroyed, mounting none of the
    # caches the ci pool carries. This job holds `contents: write` for forty turns, so
    # nothing it leaves behind should be able to reach the next job. Since 2026-09-21 the
    # `RUNNER_AGENT` repository variable is `["blacksmith-2vcpu-ubuntu-2404-arm"]`, so
    # that machine is Blacksmith's rather than this organisation's: still one job per
    # runner and still destroyed after, but the isolation is now a third party's promise
    # instead of a local container's. The deploy jobs were deliberately left hosted for
    # the same reason - see `deploy-production.yml`. `gh variable delete RUNNER_AGENT`
    # moves this job back to the local agent pool without a pull request.
    runs-on: ${{ fromJSON(vars.RUNNER_AGENT || '["self-hosted","linux","ARM64","agent"]') }}
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Required by the action's default GitHub App authentication.
      id-token: write
      # Lets Claude read the CI results on a pull request it is asked about.
      actions: read

    steps:
      # The `secrets` context is not available in a job-level `if`, so the gate is a first step -
      # the same shape claude-code-review.yml and deploy.yml use for their own credentials.
      #
      # Without it a missing or expired token fails the action, `claude-usage-limit.mjs` then finds
      # no execution file, and the job goes red with an ENOENT that names neither the missing secret
      # nor the fix. This workflow is interactive - somebody wrote the trigger phrase and is
      # watching - so what comes back should say what is wrong rather than look like a broken job.
      - name: Check the answering credentials are configured
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is unset - skipping the answer to this mention."
            echo "::warning::Generate one with \`claude setup-token\` and set it as a repository secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Claude runs `pnpm lint`, `pnpm typecheck` and `pnpm test` itself while it
      # works. Installing here rather than leaving it to figure out the package
      # manager saves it a couple of turns on every single run.
      - name: Set up the toolchain
        if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup

      # `continue-on-error`, because the step that follows decides what the failure meant: a spent
      # usage limit answered nothing and is not a bug, anything else still fails the job.
      - name: Answer the mention
        id: claude
        if: steps.gate.outputs.configured == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Git Flow: agent branches are cut from develop and their pull
          # requests target develop; promotion to main is a separate PR.
          base_branch: develop
          claude_args: |
            --max-turns 40

      # A skipped step's outcome is `skipped`, so the credential gate above short-circuits this
      # one too - the same note claude-code-review.yml carries over its own copy of this step.
      - name: Treat an exhausted Claude limit as a skipped answer
        if: always() && steps.claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/ci/claude-usage-limit.mjs
