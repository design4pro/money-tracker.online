name: CI

# The gate. The rungs below are the definition of "green" for this repository,
# in this order and with these commands:
#
#   1. route-tree  pnpm generate-routes     && git diff --exit-code -- src/routeTree.gen.ts
#   2. db-drift    pnpm db:generate         && git diff --exit-code -- drizzle/
#   3. spec-index  pnpm generate-spec-index && git diff --exit-code -- .ai/specs/README.md
#   4. typecheck   tsc --noEmit
#   5. lint        eslint
#   6. vitest      vitest run
#
# CI adds two rungs the sandbox cannot afford on every iteration: a production
# build, and the browser suites (e2e + accessibility). Changing a rung here
# without changing validate.sh is how the two drift, and a drift means the loop
# merges what CI then rejects.
#
# ── GitHub configuration this workflow needs ──────────────────────────────────
# secrets    (none are required by the gate itself; `secrets: inherit` hands the two deploy jobs
#            at the end what deploy-staging.yml and deploy-production.yml list)
# variables  VITE_POLAR_PRODUCT_PLUS_MONTHLY, VITE_POLAR_PRODUCT_PLUS_YEARLY,
#            VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY,
#            VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY, VITE_SENTRY_DSN
#            RUNNER_CI - unset again since 2026-09-21, which is the state
#            these files are written for: every gate job below falls back to
#            the array beside its `runs-on` and runs on the local pool, ARM64
#            containers labelled `ci` on one machine shared with the other
#            repository. The variable is how the pool is left without a pull
#            request: `gh variable set RUNNER_CI '["ubuntu-latest"]'` moves
#            the gate jobs onto GitHub-hosted machines in one command, and
#            deleting it again brings them back. The two deploy jobs at the
#            end do not read it - their runner is `RUNNER_DEPLOY`'s, so
#            recovering shipping when the host is down is
#            `gh variable set RUNNER_DEPLOY '["ubuntu-latest"]'` as well, as
#            deploy-production.yml says. That lever was pulled twice on 2026-09-21,
#            first to `["ubuntu-latest"]` and then to
#            `["blacksmith-2vcpu-ubuntu-2404-arm"]`, and what the day measured
#            is written down in deploy-production.yml. A repository variable -
#            there is no organisation-level one - so it moves this repository
#            alone; setting one at the organisation level would move the
#            siblings too. See design4pro/cezar, `docs/host/README.md`,
#            "The runner pool".
# ──────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main, develop]
  # The merge queue builds the commit that will become `develop` and waits for this workflow's
  # required checks on it. That is where the suite runs once per change (ADR 0020): a pull request
  # gets the fast rungs, this event gets everything including the journeys, and the push the queue's
  # merge causes finds the verdict on its own SHA and only deploys.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, develop]
  workflow_dispatch:

# One run per branch. On a pull request a push supersedes the run it interrupted. A push to
# `develop` or `main` is never cancelled, because that run ends by deploying (`deploy-staging` /
# `deploy-production` below) and an interrupted `d1 migrations apply` would leave the schema between
# two versions. Those runs queue instead: GitHub keeps one pending run per group and replaces it
# with the newest, so a burst of merges costs two runs, not one each.
#
# A merge group is never cancelled either, and needs no rule of its own: `github.ref` is that
# group's own `gh-readonly-queue/...` branch, unique per entry, so queue runs share no group. That
# matters more here than it reads - a cancelled required check is how the queue decides to drop a
# pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  # Polar product ids are public and are inlined into both bundles by Vite, so
  # the build needs them to produce the same output CI is meant to verify. They
  # live in repository *variables*, never in secrets. Leave one unset and the
  # build still goes green - `requirePrice()` throws for that plan and interval
  # alone, at the moment a customer clicks Upgrade.
  VITE_POLAR_PRODUCT_PLUS_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_PLUS_MONTHLY }}
  VITE_POLAR_PRODUCT_PLUS_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_PLUS_YEARLY }}
  VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_HOUSEHOLD_MONTHLY }}
  VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_HOUSEHOLD_YEARLY }}
  # Public by construction - it ships in the client bundle - so a variable, not
  # a secret. Empty is fine: the SDK is tree-shaken out of the bundle entirely.
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  VITE_ENVIRONMENT: ci

jobs:
  # Has this tree already passed? Only a push can have an earlier verdict, and after a queue merge
  # it always does: the queue ran these same checks on the commit it then moved `develop` to, so the
  # suite below would be judging a commit it has already judged. A promotion into `main` carries the
  # verdict of the `develop` tip it has the tree of. Anything else - a direct push, an admin bypass,
  # a hotfix - finds nothing, and the suite runs exactly as it did before (ADR 0020).
  #
  # Not finding a verdict is the safe direction and costs a full run; the script explains what it
  # takes to find one, and `scripts/ci/__tests__/verified-tree.test.mjs` pins the decision.
  verdict:
    name: verdict
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","ARM64","ci"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      # The one scope this adds to the whole workflow, and the only thing it is for: reading this
      # repository's own workflow runs.
      actions: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}

    steps:
      # Depth 2 is the pushed commit and its parents, which is all the script compares: a merge
      # commit has the tree of the side it merged whenever it adds nothing of its own.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Look for a run that already judged this tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/ci/verified-tree.mjs

  # Rungs 1-5 plus the build, in ladder order.
  verify:
    needs: verdict
    name: generated · typecheck · lint · build
    # A develop→main (or main→develop) pull request duplicates the push-triggered
    # run on the same commits; the push run is canonical for the shared branches.
    #
    # `verdict` is skipped on every event but a push, and a skipped job's output is empty, so the
    # first clause only ever stands down when a real earlier run said this tree passed. `!cancelled()`
    # rather than the implicit `success()`, which would read the skipped `verdict` as a reason to skip
    # this too (design4pro/planned.travel#531).
    if: ${{ !cancelled() && needs.verdict.outputs.verified != 'true' && (github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)) }}
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","ARM64","ci"]') }}
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # Rung 1 - route-tree drift.
      #
      # `src/routeTree.gen.ts` is generated and committed. Regenerating it here
      # proves the committed copy matches the route files in the same commit - a
      # stale tree is otherwise only discovered as a mystery type error.
      - name: Generate the route tree
        run: pnpm generate-routes

      - name: Check the committed route tree is current
        run: |
          set -euo pipefail
          # --intent-to-add first: `git diff` is blind to a file git has never
          # seen, so without this a *new* generated file (a first route in a new
          # directory) reports clean and the drift ships.
          git add --intent-to-add -- src/routeTree.gen.ts
          git diff --exit-code -- src/routeTree.gen.ts

      # Rung 2 - db drift. A schema edit with no committed migration is caught
      # here rather than in production, where it presents as a query against a
      # column that does not exist.
      #
      # `< /dev/null` because drizzle-kit asks, on a rename it cannot infer,
      # whether a column was created or renamed. On a runner there is nobody to
      # answer, and a prompt with no stdin hangs until the job timeout instead of
      # failing. Closed stdin turns that into an immediate, readable error.
      - name: Generate migrations from the schema
        run: pnpm db:generate < /dev/null

      - name: Check every schema change has a committed migration
        run: |
          set -euo pipefail
          git add --intent-to-add -- drizzle/
          if ! git diff --exit-code -- drizzle/; then
            echo "::error title=Uncommitted migration::The schema and drizzle/ disagree. Run 'pnpm db:generate' and commit the result - migrations are additive, and the running Worker has to survive the migrate-then-deploy window."
            exit 1
          fi

      # Rung 3 - the spec index.
      #
      # `.ai/specs/README.md` is generated from the metadata table in each spec.
      # Regenerating it here proves the committed index names the same states,
      # issues and pull requests the documents do - a spec whose table was edited
      # without regenerating is otherwise only discovered by a reader trusting a
      # stale row.
      - name: Generate the spec index
        run: pnpm generate-spec-index

      - name: Check the committed spec index is current
        run: |
          set -euo pipefail
          # As with the route tree: `git diff` cannot see a file git has never
          # been told about, and the first spec added to an empty status
          # directory is exactly that case.
          git add --intent-to-add -- .ai/specs/README.md
          git diff --exit-code -- .ai/specs/README.md

      # Rung 4.
      - name: Typecheck
        run: pnpm typecheck

      # Rung 5.
      #
      # ESLint spends its time building a typed program and then walking it, and
      # on a pull request almost none of that work is new. `--cache` skips a file
      # whose bytes have not changed since the last run.
      #
      # Pull requests only, and that restriction is the point. The typed rules
      # mean a change to one file can change another file's verdict, and the
      # cache cannot know that - it keys on each file's own content, so a lint
      # can come back green over an error it simply did not look at. The uncached
      # run on a push to `develop` or `main` is the canonical one, and it is the
      # one that guards the shared branch.
      - name: Restore the ESLint cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@v6
        with:
          path: .eslintcache
          # `github.sha` never hits, so every run saves a fresh entry and the
          # `restore-keys` prefix picks up the most recent one. Changing the
          # config, the tsconfig or a dependency starts a new lineage, because a
          # cache from before any of those describes a different lint.
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-

      # `--cache-strategy content` and not the default. ESLint decides a file is
      # unchanged by size and mtime unless told otherwise, and a fresh checkout
      # stamps every file with a new mtime - so the default strategy restores a
      # perfectly good cache and then ignores all of it.
      - name: Lint
        run: >-
          pnpm lint ${{ github.event_name == 'pull_request'
          && '--cache --cache-strategy content' || '' }}

      # No `pnpm check` rung. Formatting is enforced on the way in - lint-staged on commit, and
      # the format-file.sh Claude hook on every edit. Adding it here as well would gate on
      # something no local run gates on.
      - name: Build
        run: pnpm build

      # The TanStack Start vite plugin generates the same file `tsr generate`
      # does and appends the Start `Register` footer to it; `tsr.config.json`
      # carries that footer verbatim, which is what keeps the two byte-identical.
      # Should they ever drift - a Start upgrade that changes the footer, a
      # `src/router.tsx` rename, a generator bump - the build dirties the
      # committed tree, and this step says so instead of every later build and
      # dev server silently doing it.
      - name: Check the build left the route tree alone
        run: git diff --exit-code -- src/routeTree.gen.ts

      # `pnpm build` above is the plain one - no `E2E_BUILD=1` - so `vite.config.ts`
      # folds `__E2E_SERVER_TODAY__` to `undefined` and `serverToday()` falls back to
      # the wall clock. The failure this guards against is silent in every other gate:
      # if the define ever leaked into a production build, the app would serve the
      # baseline day as today's date and the browser suite - which pins that same day
      # on purpose - would keep passing while telling nobody. So assert on the artefact
      # rather than on the config that produces it, and read the day from the module
      # that owns it so this does not become the fourth copy of the date.
      - name: Check the production build carries no pinned day
        run: |
          day=$(sed -n "s/^export const BASELINE_DAY = '\\(.*\\)'$/\\1/p" e2e/baseline-day.ts)
          test -n "$day" || { echo "BASELINE_DAY not found in e2e/baseline-day.ts"; exit 1; }
          if grep -rl -e "$day" -e '__E2E_SERVER_TODAY__' dist; then
            echo "::error::The production build carries the end-to-end day pin ($day)."
            exit 1
          fi

  # Rung 6, with coverage. Its own job rather than a seventh step in `verify`: the
  # suite is CPU-bound and independent of the build, so running the two in
  # parallel is the whole gate's critical path minus whichever is shorter.
  test:
    needs: verdict
    name: unit tests · coverage
    # Same two clauses as `verify` above, for the same two reasons.
    if: ${{ !cancelled() && needs.verdict.outputs.verified != 'true' && (github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)) }}
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","ARM64","ci"]') }}
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # The route tree is an import target of half the suite; generating it
      # keeps a fresh checkout from failing on a module that is committed but
      # not yet regenerated for this commit's routes.
      - name: Generate the route tree
        run: pnpm generate-routes

      # Coverage thresholds live in vitest.config.ts and are per-glob, which is
      # why this is one unsharded run: a shard executes a fraction of the files,
      # so what it measures for any one glob is a fraction of the truth.
      - name: Run the unit suite with coverage
        run: pnpm test:coverage

      # The other half of rung 6. `test:coverage` excludes the `workerd` project
      # because it cannot be instrumented; vitest.config.ts records why, next to
      # the project itself. This step is not optional: without it the Durable
      # Object tests would run nowhere in CI, which is worse than the red check
      # the exclusion fixes.
      - name: Run the workerd suite
        run: pnpm test:workerd

      # `continue-on-error`, and one of only two uploads in this repository that carries it.
      # Nothing gates on this report - a human reads it after the fact - while the check it sits
      # in is required, so without the flag the organisation's storage bill can fail a green
      # suite: `Failed to CreateArtifact: Artifact storage quota has been hit`, run 35656190925,
      # with 216 test files passing above it (#417). The blob reports further down are the
      # opposite case and deliberately keep no flag: `e2e · merged report` downloads them.
      #
      # Three days rather than seven for the same reason. Coverage is read on the pull request
      # that produced it or not at all, and a week of pull requests is what fills a 2 GB
      # allowance.
      - name: Upload the coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 3
          if-no-files-found: ignore

  # The browser gate: the same suite, in the same container image, on two
  # projects.
  #
  # `chromium` is the desktop layout at 1440x900. `mobile-chromium` is a Pixel 7:
  # the phone layout - bottom navigation, drawers, the `*.visual.spec.ts` axe
  # scans at phone width - on the engine that was already the cheap leg. `mobile-safari` (an iPhone 15)
  # is not run here any more (#317): it took two of three legs, so WebKit at
  # phone width is checked on demand with `pnpm e2e --project=mobile-safari` by
  # the change that touches it.
  #
  # It runs with no label (ADR 0016). It was a post-merge net gated behind
  # `needs-e2e` while it carried 56 screenshot comparisons; without them there is
  # nothing left that is expensive enough to ration. `needs-e2e` is gone with the
  # gate it rationed - there is no label to add, because there is nothing to opt
  # into.
  #
  # Where it runs moved once more, to the merge queue (ADR 0020): the legs judge the commit that
  # will become `develop`, once, instead of judging a pull request's merge preview and then the
  # push that merge causes. So not on a `pull_request` at all - and on a `push` only when `verdict`
  # found no earlier run for this tree, which is the fallback for a direct push, an admin bypass
  # merge, or a hotfix on `main`.
  #
  # What that costs is in ADR 0016's amendment: the journeys report after a human enqueues rather
  # than during review, and a failure arrives as a dropped queue entry.
  e2e:
    needs: verdict
    name: e2e · ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ !cancelled() && needs.verdict.outputs.verified != 'true' && github.event_name != 'pull_request' }}
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","ARM64","ci"]') }}
    # The outer bound. `playwright.config.ts` sets `globalTimeout` to 15 minutes
    # so the run's own clock is the one that fires first and names the test it
    # died on; this only catches a job wedged before or after the suite.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # `include:` rather than two axes, so a leg that grows towards the cap can
      # take a shard of its own without multiplying the others. Two clocks, and
      # they measure different things: `globalTimeout` caps the Playwright
      # process at 900s, while `timeout-minutes` below caps the whole job - so
      # the ~152s a leg spends before that process starts (checkout, build,
      # seeded D1, server) is charged to the second clock and not the first.
      #
      # Both legs are whole, and the numbers say they can be. On `develop`
      # 00dd135 (run 35374143036) and 641b3c8 (run 35384026214) the `chromium`
      # suite step took 288s and 324s of the 900s, and the two `mobile-safari`
      # shards 220s + 191s and 245s + 200s. `mobile-chromium` is the chromium
      # engine over the same files at a phone width; the specs that exist to run
      # once (`core-flow`, `money`, `tenant-isolation`, `not-found`) skip it.
      # Against one freshly seeded preview on a workstation it ran 261 tests in
      # 272s where `chromium` ran 277 in 212s, so read it as ~1.3x the `chromium`
      # leg - roughly 420s here, half the cap - on one runner instead of the two
      # `mobile-safari` needed (#317).
      #
      # `--shard` divides by test count and not by duration, so if a leg does
      # need splitting, check the split against the blob report's per-file
      # timings first: `accessibility`, `contrast-enhanced` and
      # `desktop-density` are the slow cluster and a count split does not break
      # it up. The number in playwright.config.ts does not move.
      matrix:
        include:
          - project: chromium
            shard: 1
            shards: 1
          - project: mobile-chromium
            shard: 1
            shards: 1
    # No `container:`, and no browsers on the runner either. `./.github/actions/e2e-env`
    # installs them per job from the `@playwright/test` devDependency, so the version
    # coupling this comment used to describe - a runner image to keep in step with
    # package.json, on pain of a missing executable - is retired rather than moved. A
    # browser image per job would buy back only the download.

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Prepare the browser-test environment
        uses: ./.github/actions/e2e-env
        with:
          # Every leg seeds an identical database; auditing the seed once is
          # proof enough. The condition names a leg and not just a project
          # because the project test alone is true on every shard of it, so the
          # day `chromium` gets a second one the audit would start running
          # twice.
          verify-seed: ${{ matrix.project == 'chromium' && matrix.shard == 1 }}

      # `PLAYWRIGHT_BASE_URL` points the suite at the server the composite action
      # already started and seeded, so the config starts none of its own.
      # The GitHub reporter publishes failures even when the account's artifact quota prevents
      # blob upload. The blob remains an optional source of traces and the merged HTML report.
      # The `setup` project is not named here: it is declared as a
      # dependency of both browser projects, so Playwright runs it first on its
      # own, and naming it as well would only run it twice - once per shard is
      # already the price of splitting. `--shard` divides by test count and not
      # by duration, so a leg that draws the slow files stays the slow one;
      # check a split against the per-file timings before trusting it.
      - name: Run the suite
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3010
        run: >-
          pnpm exec playwright test --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=github,blob

      # The directory is `blob-report`, not vitest's dot-prefixed convention:
      # `upload-artifact` treats a dot-prefixed path as hidden and silently
      # uploads nothing.
      - name: Upload the blob report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload the server log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-log-${{ matrix.project }}-${{ matrix.shard }}
          path: server.log
          retention-days: 3
          if-no-files-found: ignore

  # One HTML report for both projects, with the failing frames' diffs and traces
  # in it. Merging replays recorded results rather than re-running anything, so
  # this is seconds.
  e2e-report:
    name: e2e · merged report
    needs: e2e
    # Not behind legs that were skipped - on a `develop` → `main` promotion pull request - since
    # there is nothing to merge; `!cancelled()` so a failing leg still owes the reader its report.
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","ARM64","ci"]') }}
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Download the blob reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge the reports
        run: |
          set -euo pipefail
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo '::notice title=e2e report::no shard reports to merge - the browser gate produced none.'
            exit 0
          fi
          pnpm exec playwright merge-reports --reporter html,github ./all-blob-reports

      - name: Upload the Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

      # A required check (the `develop` and `main` rulesets), so it has to be red whenever a leg
      # is. The result comes from `needs.e2e.result`, the aggregate over the matrix, which is not
      # `success` when any leg failed, was cancelled or never ran. `always()`, so a cancelled run
      # turns it red too. Last, so the report above is uploaded either way.
      - name: Fail unless every leg passed
        if: ${{ always() && needs.e2e.result != 'success' }}
        run: |
          echo "::error title=e2e::the journeys did not pass on every leg (result: ${{ needs.e2e.result }}); the report above names the failures."
          exit 1

  # The deploys, as the last jobs of a push run and only behind a green one. They used to be
  # workflows of their own, started by the same push as this run and reading nothing from it, so a
  # red commit shipped exactly like a green one: `develop` push b5598ca failed an e2e leg in run
  # 35008403366 (the `mobile-safari` shard the matrix has since dropped) while `Deploy staging` run
  # 35008403446 shipped it.
  #
  # `needs` names `e2e` and not `e2e-report`: `needs.e2e.result` is the aggregate over the matrix,
  # `success` only when every leg passed. The report went green over that failed leg until it
  # learned to check the same result, and gating on the source beats gating on its echo.
  #
  # The `if` checks each result itself rather than leaving it to the implicit `success()` a job
  # gets when its `if` has no status function: at job level that reads every ancestor in the needs
  # graph, so a job a later change makes skip on a push would skip every deploy while the run stays
  # green (design4pro/planned.travel#531). A failed, cancelled or skipped gate job is not `success`,
  # so it still blocks. The token is the workflow's `contents: read`, which is all either deploy
  # workflow asks for; a called workflow can narrow it and never widen it.
  # Two ways to be green, and the deploys accept either: this run passed the gate jobs, or `verdict`
  # found a run that already passed it on this tree (ADR 0020). The second is what a queue merge and
  # a promotion take - the gate jobs are skipped there, and a skipped job is not `success`, so
  # without the first clause nothing would ever deploy again.
  deploy-staging:
    name: deploy · staging
    needs: [verdict, verify, test, e2e]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && (needs.verdict.outputs.verified == 'true' || (needs.verify.result == 'success' && needs.test.result == 'success' && needs.e2e.result == 'success')) }}
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  deploy-production:
    name: deploy · production
    needs: [verdict, verify, test, e2e]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.verdict.outputs.verified == 'true' || (needs.verify.result == 'success' && needs.test.result == 'success' && needs.e2e.result == 'success')) }}
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
