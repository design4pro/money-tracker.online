# Blank issues stay on. `om-auto-manage-issues` reads and enriches issues, and a form that forces
# a shape on a two-line note would only get worked around.
blank_issues_enabled: true

contact_links:
  - name: Security report
    url: https://money-tracker.online/security
    about: >
      Do not open a public issue for a vulnerability. The disclosure address and PGP key are on
      the security page.
  - name: Lifecycle and labels
    url: https://github.com/design4pro/money-tracker.online/blob/develop/SDLC.md
    about: >
      How an issue becomes a merged pull request, and what each label means. One category per
      issue; the pipeline labels are written by the agents and read by the merge skills.
