name: Agent slice
description: One self-contained slice, briefed well enough for the agent loop to finish unattended.
title: 'slice: '
labels: ['status: triage']
body:
  - type: markdown
    attributes:
      value: >
        This form writes the Agent Brief the loop reads. Fill it and the triager has almost
        nothing left to do; leave half of it and the issue sits.


        **`status: ready` is not applied by this form.** That is the gate, and a gate a reporter
        can open is not a gate: a triage run sets it once the brief below actually holds
        (docs/adr/0014-label-protocol.md). Add a `type:` label yourself - this form cannot know
        whether the slice fixes a bug or adds behaviour, and every issue without a parent needs
        one. A slice, never a PRD: if this needs more than one branch to land, open the parent and
        let it spawn children.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph. What changes, and where.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current behaviour
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: Desired behaviour
    validations:
      required: true

  - type: textarea
    id: fix-direction
    attributes:
      label: Fix direction
      description: >
        The approach, not the diff. Where the change belongs in the layering - route → server
        function → repository - and which existing pattern it should follow.
    validations:
      required: true

  - type: textarea
    id: interfaces
    attributes:
      label: Key interfaces
      description: >
        The types, function signatures and config shapes to look for - never file paths or line
        numbers. Paths go stale while the issue waits; a signature does not.
      placeholder: |
        `TransactionRepo.listByFilter(filter: TransactionFilter): Promise<TransactionRow[]>`
        `TransactionFilter.tagIds?: string[]`
    validations:
      required: true

  - type: textarea
    id: owned-paths
    attributes:
      label: Owned paths
      description: >
        Every path this slice may write. Shared paths - the router, the schema, the i18n message
        files, package.json - belong to no slice and are edited by a human.
      placeholder: |
        src/routes/_app/transactions/index.tsx
        src/server/repos/transactions.ts
        src/server/repos/__tests__/transactions.test.ts
    validations:
      required: true

  - type: textarea
    id: tenant-isolation
    attributes:
      label: Tenant isolation test
      description: >
        Which case in `src/server/repos/__tests__/tenant-isolation.test.ts` covers this, or the
        one that has to be added. Every read and every write goes through the tenant-scoped
        repository, and the predicate is not removable.
    validations:
      required: true

  - type: textarea
    id: money-invariant
    attributes:
      label: Money invariant
      description: >
        Which amount this slice touches and what must stay true of it: integer minor units end to
        end, `rate_e10` and the ref amount carried across the base-currency boundary, no
        recomputed historical conversion. Write "none - touches no amount" if that is the case.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: The commands and the assertions that decide this is done.
      placeholder: |
        pnpm test src/server/repos/__tests__/transactions.test.ts
        pnpm e2e e2e/transactions.spec.ts
        Filtering by two tags returns only rows carrying both
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What an agent must not touch while doing this, even if it looks wrong.
    validations:
      required: true

  - type: checkboxes
    id: signals
    attributes:
      label: Signals
      description: >
        These become labels on the issue or the pull request. Tick what is true; the triager
        applies them.
      options:
        - label: 'Changes rendered output on purpose (`visual-change-expected`)'
        - label: 'Needs the browser suite on the pull request (`needs-e2e`)'
        - label: 'Needs a human to exercise it by hand afterwards (`qa`)'
