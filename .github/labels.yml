# The label vocabulary, in one place.
#
# This file is documentation, not automation: nothing syncs it. It exists because the issue forms
# under .github/ISSUE_TEMPLATE/ apply labels by name, and GitHub silently drops a label that does
# not exist on the repository - so a missing label here shows up as a form that quietly applies
# nothing.
#
# To create them all on a fresh repository:
#
#   node --input-type=module -e "
#     import { readFileSync } from 'node:fs';
#     import { execFileSync } from 'node:child_process';
#     for (const line of readFileSync('.github/labels.yml','utf8').split('\n')) {
#       const m = /^  - name: '(.+)'\s*$/.exec(line); if (!m) continue;
#       execFileSync('gh', ['label','create',m[1],'--force'], { stdio: 'inherit' });
#     }
#   "
#
# and then set each colour and description by hand, or with `gh label edit`.

# ── the agent gate ────────────────────────────────────────────────────────────────────────────
# `ready-for-agent` goes on a SLICE, never on a PRD. It is the only label that makes the loop pick
# an issue up, and it means: the brief is complete enough that an agent can finish it unattended.
gate:
  - name: 'ready-for-agent'
    description: 'A single slice, briefed well enough for an agent to finish unattended. Never on a PRD.'
  - name: 'agent-blocked'
    description: 'An agent stopped on this and needs a human decision before it can continue.'

# ── what kind of change ───────────────────────────────────────────────────────────────────────
type:
  - name: 'type: bug'
    description: 'Behaviour that is wrong against a stated expectation.'
  - name: 'type: enhancement'
    description: 'New behaviour, or better behaviour that was never promised.'
  - name: 'type: maintenance'
    description: 'Dependencies, tooling, refactoring, docs. No user-visible behaviour change.'

# ── where it stands ───────────────────────────────────────────────────────────────────────────
status:
  - name: 'status: pending'
    description: 'Filed, not yet triaged.'
  - name: 'status: on hold'
    description: 'Deliberately paused. The reason is in a comment.'
  - name: 'status: review needed'
    description: 'Work exists and is waiting on a human read.'
  - name: 'status: blocked'
    description: 'Cannot proceed until something outside this issue changes.'
  - name: 'status: abandoned'
    description: 'Closed without doing it, on purpose. The reason is in a comment.'

# ── how urgent ────────────────────────────────────────────────────────────────────────────────
priority:
  - name: 'priority: critical'
    description: 'Data loss, money wrong, or the product is down. Interrupt whatever is in flight.'
  - name: 'priority: high'
    description: 'Next in line.'
  - name: 'priority: medium'
    description: 'Scheduled work.'
  - name: 'priority: low'
    description: 'Worth doing, whenever.'

# ── what CI and the loop must do about it ─────────────────────────────────────────────────────
signals:
  - name: 'needs-e2e'
    description: 'Run the browser suite on this pull request. The escape hatch for branches with no local loop behind them.'
  - name: 'visual-change-expected'
    description: 'Rendered output changes on purpose. A screenshot diff here is the intent, not a regression.'
  - name: 'qa'
    description: 'Ready for a human to exercise by hand.'
  - name: 'qa-failed'
    description: 'A human exercised it and it did not hold up. The report is in a comment.'
