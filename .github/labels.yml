# The label vocabulary, in one place.
#
# Labels are the backlog's state machine (docs/adr/0014-label-protocol.md). The vocabulary is
# closed at the 18 labels below and any label outside it is deleted by
# scripts/agent/labels-migrate.sh. It was 19 until ADR 0016 retired `needs-e2e` along with the
# visual gate it rationed: the browser suite now runs on every pull request, so there is nothing
# left to opt into.
#
# This file is documentation, not automation: nothing syncs it. It exists because the issue forms
# under .github/ISSUE_TEMPLATE/ apply labels by name, and GitHub silently drops a label that does
# not exist on the repository - so a missing label here shows up as a form that quietly applies
# nothing.
#
# To create or repair the whole set on a repository, run the migration:
#
#   scripts/agent/labels-migrate.sh            # plan only
#   scripts/agent/labels-migrate.sh --apply    # perform
#
# It carries the colours and descriptions, so this file states meaning and nothing else.

# ── where an issue stands: exactly one of these on every open issue ───────────────────────────
status:
  - name: 'status: triage'
    description: 'New, not yet reproduced. A triage run picks it up.'
  - name: 'status: needs-info'
    description: 'Triage needs an answer from the reporter. The questions are in a comment.'
  - name: 'status: backlog'
    description: 'A feature or idea waiting for a plan run, or for a decision.'
  - name: 'status: queued'
    description: 'A ticket with an open native blocker. The sweeper opens it when the blocker closes.'
  - name: 'status: ready'
    description: 'Specified and unblocked. `run: implement` may claim it.'
  - name: 'status: in-progress'
    description: 'A run holds it. Written by the claim scripts and by nothing else.'
  - name: 'status: review'
    description: 'An artefact waits for a human: a draft PR, a spec, a PRD, a set of tickets.'
  - name: 'status: needs-human'
    description: 'A workflow could not finish. The comment says why.'

# ── commands a human gives; a script consumes them ────────────────────────────────────────────
# A command is not a state. The claim script removes the `run:` label as its first action, so a
# command still sitting there is a command nobody has taken.
run:
  - name: 'run: triage'
    description: 'Command: (re)triage this issue. Bypasses the already-triaged marker.'
  - name: 'run: implement'
    description: 'Command: implement this ticket.'

# ── what kind of change: mandatory on every issue without a parent ────────────────────────────
# Tickets inherit their PRD's type and carry none of their own.
type:
  - name: 'type: bug'
    description: 'Behaviour that is wrong against a stated expectation.'
  - name: 'type: feature'
    description: 'A new capability. Needs a spec and a PRD before tickets.'
  - name: 'type: enhancement'
    description: 'Better behaviour that was never promised.'
  - name: 'type: maintenance'
    description: 'Dependencies, tooling, refactoring, docs. No user-visible behaviour change.'

# ── the parent, and the one place autonomy widens ─────────────────────────────────────────────
structure:
  - name: 'prd'
    description: 'Parent issue: title `PRD:`, body `prd/v1`, its sub-issues are the tickets.'
  - name: 'auto-advance'
    description: 'On an open PRD only: the sweeper adds `run: implement` to each child as it unblocks.'

# ── pull-request labels ───────────────────────────────────────────────────────────────────────
pull_request:
  - name: 'agent-pr'
    description: 'A draft pull request opened by an implement run.'
  - name: 'agent-docs'
    description: 'A pull request carrying CONTEXT.md or ADR changes from a plan run.'

# There is no priority axis, and "visual change expected" is a body section
# (`## Visual change expected`), not a label.
