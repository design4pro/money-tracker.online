name: Prepare the browser-test environment
description: >
  Everything a browser suite needs before its first page load: dependencies, a
  generated route tree, a throwaway .dev.vars, a migrated local D1, a production
  build served by `vite preview` on port 3010, and the seeded demo workspace
  behind it.

  Two workflows need this identical preparation - the e2e gate in ci.yml and the
  accessibility gate in a11y.yml - and a drift between them would show up as a
  suite that only fails in one of the two. So it lives here once.

  Installs the browsers rather than assuming them. The assumption held while
  these jobs ran in `mcr.microsoft.com/playwright:v<version>-noble`, and then
  while they ran on a self-hosted pool whose image was built FROM exactly that.
  It stopped holding when they moved to a pool that carries no browsers: every
  run failed at the first page load, and because the e2e legs run on a push and
  not on a pull request (ADR 0020) the required merged report kept reporting
  skipped while it did (#403). A step is testable; an assumption about the
  machine is not.

  There is no R2 fetch and no asset cache here. This product has no basemap and
  no large binary fixture: the seed is pure SQL through the Worker, so the whole
  preparation is dependencies plus a database.

inputs:
  port:
    description: >
      Port the preview server binds. 3010 is what vite.config.ts pins with
      `strictPort` and what playwright.config.ts defaults `baseURL` to; passing
      anything else means passing PLAYWRIGHT_BASE_URL to match.
    required: false
    default: '3010'
  verify-seed:
    description: >
      Run scripts/seed/verify.mjs after seeding, when that script exists. The
      seed audit costs ~25 s of wrangler subprocesses, so a sharded gate can
      turn it off on all but one shard.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up the toolchain
      uses: ./.github/actions/setup

    # First, so a runner without browsers says so in seconds rather than after a build and a
    # seed. `pnpm exec` takes the version from the `@playwright/test` devDependency the lockfile
    # already fixes, which retires the image-to-package coupling this action used to carry rather
    # than moving it somewhere new. `chromium` alone is what CI opens: ci.yml's matrix runs the
    # `chromium` and `mobile-chromium` projects and .github/a11y/axe-scan.mjs calls
    # `chromium.launch()`; the `webkit` and `mobile-safari` projects in playwright.config.ts run
    # locally and are not this gate's to download.
    #
    # Not cached, deliberately. The runners are ephemeral, so this downloads once per job - two
    # e2e legs plus the axe gate - and a cache keyed on the Playwright version trades that for a
    # restore whose speed on this pool nobody has measured. The one measurement this repository
    # does have went the other way: ../setup/action.yml carries a `cache: pnpm` restore that cost
    # 198 s of a 134 s-average step on the pool it was meant to speed up. Measure this install
    # before adding a key to it.
    - name: Install the browsers
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Generate route tree
      shell: bash
      run: pnpm generate-routes

    # `vite dev` loads this through Miniflare exactly as `wrangler secret put`
    # does in production. Every value here is a throwaway for a database that
    # exists for the length of this job: nothing signs anything that outlives it.
    #
    # Runtime secrets go in .dev.vars and build-time public values in
    # .env.local, and the split is not cosmetic: while a .dev.vars exists,
    # Cloudflare loads no .env file into the Worker's `env`, and a VITE_ name
    # written into .dev.vars is silently empty at build time rather than an
    # error. See .dev.vars.example.
    - name: Write the throwaway .dev.vars
      shell: bash
      run: |
        set -euo pipefail
        cat > .dev.vars <<EOF
        BETTER_AUTH_SECRET=$(openssl rand -base64 32)
        APP_URL=http://localhost:${{ inputs.port }}
        EOF

    - name: Apply D1 migrations to the local database
      shell: bash
      run: pnpm db:migrate:local

    # A build, not `vite dev`, and the reason is measured rather than stylistic.
    # Under the dev server Vite compiles the client module graph per route on
    # first visit, so every screen a spec opens is paid for once - and in run
    # 33744603513 that was 202 `waitForHydration` waits totalling 696s of the
    # chromium job's 1005s, averaging 3.4s each and peaking at 8.7s. It put the
    # suite's two longest tests over their 30s ceiling for no reason connected
    # to the product. A built bundle has no per-route compile, and it is also
    # the artefact that actually ships, so the gate now measures what deploys
    # rather than what a developer's watcher serves.
    #
    # `pnpm dev` stays the local path (playwright.config.ts starts it): a build
    # before every local run would cost the fast loop the gate does not need.
    # That divergence is deliberate and is the reason this action exists - CI is
    # the only place both browser workflows agree on.
    #
    # `E2E_BUILD=1` folds `e2e/baseline-day.ts` into the bundle as the day the server believes it
    # is. The suite photographs screens that read a clock - the dashboard opens on the current
    # month, budget bars divide by days elapsed - and `src/server/clock.ts` only honours the
    # `x-mt-server-today` header under `import.meta.env.DEV`, which a build folds away on purpose.
    # Without this the gate would compare August's baselines against whatever month the runner
    # woke up in, which is how 24 screenshots failed the first time this step served a build.
    # Unset, the define emits `undefined` and the branch leaves the bundle, so nothing about a
    # deployed worker changes.
    - name: Build the application
      shell: bash
      env:
        E2E_BUILD: '1'
      run: pnpm build

    # Started here rather than by Playwright's `webServer` because the seed has
    # to run against it before the first spec: the seed writes through the
    # Worker, so there is no seeding a database without a server in front of it.
    - name: Start the preview server
      shell: bash
      env:
        PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        # --host binds v4 and v6. The wait loop below (curl) reaches a ::1-only
        # vite over IPv6 and reports the server up, but Node's fetch in seed.mjs
        # resolves localhost to 127.0.0.1 and then finds nothing - the seed then
        # fails against a server curl just proved alive.
        #
        # `vite preview` runs the built Worker in workerd through
        # @cloudflare/vite-plugin, against the same local D1/KV/R2 under
        # .wrangler/state that the migration step above just prepared - so the
        # seed still writes through the Worker exactly as it did under dev.
        pnpm exec vite preview --port "$PORT" --strictPort --host > server.log 2>&1 &
        for _ in $(seq 1 60); do
          if curl --silent --fail --output /dev/null "http://localhost:$PORT/"; then
            echo "preview server up on :$PORT"
            exit 0
          fi
          sleep 2
        done
        echo "::error title=Preview server::did not answer on :$PORT within 120s"
        tail -50 server.log
        exit 1

    # The seed is a first-class artefact, not a convenience: the demo workspace
    # it writes (accounts across three currencies, ~600 transactions over 18
    # months, budgets, recurring series, goals, rules) is the fixture every
    # screenshot and every axe scan is taken against. A missing seed is a hard
    # error rather than an empty run, because an empty run is green for the
    # wrong reason.
    - name: Seed the demo workspace
      shell: bash
      env:
        PORT: ${{ inputs.port }}
      run: node scripts/seed/seed.mjs --url "http://localhost:$PORT"

    # Optional by design: verify.mjs audits the seed's invariants (double-entry
    # transfers balance, every ref amount carries its rate) and is worth running
    # once, but a checkout that has not grown it yet must still be able to run
    # the suite.
    - name: Verify the seed
      if: inputs.verify-seed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ -f scripts/seed/verify.mjs ]; then
          node scripts/seed/verify.mjs
        else
          echo '::notice title=Seed verification::scripts/seed/verify.mjs does not exist yet - skipped.'
        fi

# The server's stdout lands in `server.log` in the workspace. Uploading it is the
# caller's job, not this action's: an artifact name has to be unique within a
# workflow run, and only the caller knows its own matrix.
