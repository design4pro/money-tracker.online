<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mockup — Edit a connected app</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.45 'Iowan Old Style',
          Palatino,
          serif;
        background: #f6f1e8;
        color: #1b1916;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      .badge {
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #5c574f;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        background: #fffdf8;
        border-bottom: 1px solid #e4dccf;
        padding: 12px;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        padding: 0 12px;
        font: inherit;
        background: #fffdf8;
        border: 1px solid #1b1916;
        border-radius: 2px;
      }
      button.primary {
        background: #1b1916;
        color: #fffdf8;
      }
      button.danger {
        color: #8b1e1e;
        border-color: #8b1e1e;
        background: transparent;
      }
      dialog {
        border: 1px solid #e4dccf;
        border-radius: 2px;
        padding: 20px;
        width: min(440px, 92vw);
        background: #fffdf8;
      }
      label {
        display: block;
        font-weight: 700;
        margin-top: 16px;
      }
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        min-height: 40px;
        margin-top: 4px;
        border: 1px solid #1b1916;
        border-radius: 2px;
        padding: 8px;
        font: inherit;
        background: #fffdf8;
      }
      .preview {
        margin-top: 4px;
        color: #5c574f;
      }
      fieldset {
        border: 0;
        margin: 16px 0 0;
        padding: 0;
      }
      legend {
        font-weight: 700;
        padding: 0;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="badge">Proposed · /settings/agents · edit dialog</p>
      <h1>Connected agents</h1>
      <p>Illustrative. Synthetic names only.</p>
      <div class="row">
        <strong>Household laptop</strong>
        <span>OAuth app</span>
        <span>Read accounts</span>
        <span>Last used 2 Nov 2026</span>
        <button type="button">Edit settings</button>
        <button type="button" class="danger">Revoke</button>
      </div>

      <dialog open>
        <h2>Settings for Household laptop</h2>
        <p class="preview">OAuth app · Last used 2 Nov 2026</p>
        <label>
          Name
          <input type="text" value="Household laptop" />
        </label>
        <fieldset>
          <legend>Access</legend>
          <label class="check">
            <input type="checkbox" checked /> Read accounts
          </label>
          <label class="check">
            <input type="checkbox" /> Create and change accounts
          </label>
          <label class="check">
            <input type="checkbox" /> Delete accounts
          </label>
          <label class="check">
            <input type="checkbox" checked /> Read entries
          </label>
          <label class="check">
            <input type="checkbox" checked /> Create and change entries
          </label>
          <label class="check">
            <input type="checkbox" /> Delete entries
          </label>
          <p class="preview">Twelve further permissions follow the same row.</p>
        </fieldset>
        <div class="actions">
          <button type="button">Cancel</button>
          <button type="button" class="primary">Save</button>
        </div>
      </dialog>
    </main>
  </body>
</html>
