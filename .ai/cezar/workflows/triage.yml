# Started by the `needs-triage` label (docs/agents/cezar-automations.json). afk-triage verifies the
# report, writes one Agent Brief comment and sets exactly one intake label; its own rules say it
# never edits code, commits, closes an issue or removes a human's label, so the step holds no Edit
# and no Write - the grant is the boundary, not a promise in prose. Bash is unallowlisted because
# the tracker descriptor's operations are `gh` command lines.
name: triage
description: Triage one GitHub issue unattended - verify, write an Agent Brief, set one intake label (afk-triage).
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm generate-routes
  - id: afk-triage
    name: afk-triage
    prompt: '/afk-triage {{task}}'
    allowedTools: [Read, Grep, Glob, Bash, Skill, TodoWrite]
