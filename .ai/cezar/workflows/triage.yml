# The triage workflow: verify one new issue against HEAD and route it, without a human in the
# loop and without ever closing anything. Started by the `triage-opened` automation (a new issue
# carrying `status: triage`) or `triage-relabel` (a human adds `run: triage`).
#
# Only the last agent step is interactive in cezar, so the two deterministic steps come first as
# commands and the skill is the last step of the file. The verdict reaches GitHub only through
# scripts/agent/triage-apply.sh.
name: triage
description: Reproduce a new issue at HEAD and route it (ready, needs-info, backlog or needs-human); never closes.
steps:
  - id: claim
    name: Claim the issue
    command: scripts/agent/cez-triage-claim.sh
  - id: setup
    name: Install and generate routes
    command: scripts/agent/cez-setup.sh --no-e2e
  - id: triage
    name: Triage
    prompt: '/triage-ticket {{task}}'
    model: sonnet
    allowedTools: [Read, Grep, Glob, Write, Bash, TodoWrite]
    bashAllowlist:
      - gh issue view
      - gh issue list
      - gh pr list
      - git status
      - git diff
      - git log
      - pnpm typecheck
      - pnpm lint
      - pnpm generate-routes
      - pnpm db:generate
      - scripts/agent/gh-ro.sh
      - scripts/agent/cez-test.sh
      - scripts/agent/triage-apply.sh
