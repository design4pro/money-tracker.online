# The review job left unresolved threads on a PR and .github/workflows/claude-code-review.yml
# applied `review-threads` (ADR 0017). om-auto-fix-pr merges the latest base, delegates the review
# and autofix to om-auto-review-pr - which fixes each inherited thread and, per the repo override,
# replies in it and resolves it - stabilizes CI, files follow-ups for the non-blocking findings and
# leaves a merge-ready PR. It never merges: a human runs om-approve-merge-pr from the cockpit.
#
# The repo-local override (.ai/skills/om-auto-fix-pr/) removes `review-threads` as its first
# mutation, so a label still present is a run nobody took - the same contract `autofix` has on
# issues. That removal is also what makes the trigger re-armable: the next push re-runs the review
# job, which re-applies the label only if threads are still open at the new head.
name: pr-fix
description: Unresolved review threads on a PR; om-auto-fix-pr drives it to merge-ready and resolves them.
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm generate-routes
  - id: fix
    name: om-auto-fix-pr
    prompt: '/om-auto-fix-pr {{task}}'
    # `Task` dispatches the review personas in .claude/agents (CODE_REVIEW.md -> Review personas).
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Task]
