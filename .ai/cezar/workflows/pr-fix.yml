# Manual PR-fix workflow. om-auto-fix-pr merges the latest base, delegates review and autofix to
# om-auto-review-pr, resolves inherited threads it can settle, stabilizes CI and leaves a
# merge-ready PR. It never merges: a human runs om-approve-merge-pr from the cockpit.
name: pr-fix
description: Manually drive a PR to merge-ready and resolve inherited review threads.
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: bash .ai/scripts/bootstrap.sh
  - id: fix
    name: om-auto-fix-pr
    prompt: '/om-auto-fix-pr {{task}}'
    # `Task` / `Agent` (old and new name of one tool) dispatch the review personas in .claude/agents
    # (CODE_REVIEW.md -> Review personas).
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Task, Agent]
