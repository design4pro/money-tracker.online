# Every issue a maintainer opens (automation `issue-opened`), or an issue number typed in the
# cockpit. om-auto-manage-issues adds the SDLC labels (category, priority, risk), checks the
# Definition of Ready and comments its analysis; it never writes code, so Edit and Write are
# off. The agent step holds Bash with no allowlist and the issue body is its input, which is why
# the automation is gated on the author (docs/agents/cezar-automations.json).
name: om-manage-issue
description: Labels, Definition of Ready and analysis for one issue with om-auto-manage-issues; never code.
steps:
  - id: setup
    name: Install dependencies and the om skills
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm install-skills
  - id: manage
    name: om-auto-manage-issues
    prompt: '/om-auto-manage-issues {{task}}'
    model: sonnet
    allowedTools: [Read, Grep, Glob, Bash, Skill, TodoWrite]
