# Weekday mornings, on a schedule (docs/agents/cezar-automations.json). afk-to-tickets promotes the
# ticket frontier, then slices at most one newly merged spec into vertical tickets. It reads
# `.ai/specs/`, CONTEXT.md and the two afk-*-design skills, and writes only GitHub issues - hence no
# Edit and no Write. Only the frontier gets `ready-for-agent`.
name: spec-to-tickets
description: Promote the ticket frontier, then slice at most one merged spec into tracer-bullet tickets (afk-to-tickets).
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm generate-routes
  - id: afk-to-tickets
    name: afk-to-tickets
    prompt: '/afk-to-tickets {{task}}'
    allowedTools: [Read, Grep, Glob, Bash, Skill, TodoWrite]
