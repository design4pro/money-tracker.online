# Every issue a maintainer opens, and every issue that gets the `groom` label, receives SDLC
# labels (category, priority, risk), a Definition of Ready check and a read-only
# implementation-prep comment (ADR 0017). The agent step holds Bash without an allowlist (the
# tracker descriptor needs it), and the issue body is the prompt, so the triggers are gated on
# who can write them: `issue.opened` is filtered to maintainers and `groom` can only be set by a
# collaborator (docs/agents/cezar-automations.json). The skill never edits source files; it holds
# Write and Edit for the comment-body drafts and scratch notes it hands to `gh --body-file` (runs
# 12435f6b, 831aad90 and 4e858925 were denied Edit on exactly those), and Agent for the specialist
# that settles an open question (.ai/skills/afk-decide/SKILL.md). The bootstrap is deps and the
# route tree only, no D1 and no basemap.
name: issue-groom
description: om-auto-manage-issues on one issue - labels, Definition of Ready, implementation notes; never code.
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm generate-routes
  - id: groom
    name: om-auto-manage-issues
    prompt: '/om-auto-manage-issues {{task}} --prep-impl'
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
