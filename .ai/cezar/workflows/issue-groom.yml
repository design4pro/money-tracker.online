# Started by a person from the cockpit. Its two automations are retired and kept disabled: the
# Reconciler starts `triage` and `unblock` instead (ADR 0030). The issue is groomed and
# triaged in one run (ADR 0029): om-auto-manage-issues adds the SDLC labels (category, priority,
# risk), the Definition of Ready check and a read-only implementation-prep comment (ADR 0017), then
# afk-triage writes the Agent Brief that makes it ready - or `blocked` with a comment naming the
# one thing a person must do. One run, two steps, because two automations on the same event would
# race on the same labels. Both agent steps hold Bash without an allowlist (the tracker descriptor
# needs it), and the issue body is the prompt, so both triggers are filtered to maintainers
# (docs/agents/cezar-automations.json). Neither step edits source files. The groom step holds Write
# and Edit for the comment-body drafts and scratch notes it hands to `gh --body-file` (runs
# 12435f6b, 831aad90 and 4e858925 were denied Edit on exactly those); the triage step holds the
# same tools as triage.yml, Write but no Edit. Both hold Agent for the specialist that settles an
# open question (.ai/skills/afk-decide/SKILL.md). The bootstrap is deps and the route tree only, no
# D1 and no basemap.
name: issue-groom
description: Groom and triage one issue - labels, Definition of Ready, implementation notes, then an Agent Brief or a hold; never code.
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: bash .ai/scripts/bootstrap.sh
  - id: groom
    name: om-auto-manage-issues
    prompt: '/om-auto-manage-issues {{task}} --prep-impl'
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
  - id: triage
    name: afk-triage
    prompt: '/afk-triage {{task}}'
    allowedTools: [Read, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
