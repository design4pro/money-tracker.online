# Started by a person from the cockpit on one issue: om-auto-fix-issue classifies it and drives the
# whole chain (verify, root cause, fix, PR, review, QA for UI fixes) to a reviewed PR on develop
# (ADR 0017). No automation starts it: the unattended lane is issue-groom, then implement-ticket
# (ADR 0029). No bashAllowlist by design: the tracker descriptor needs shell functions and jq;
# .claude/settings.json deny rules are the gate.
name: issue-autofix
description: om-auto-fix-issue drives one issue to a reviewed draft-then-ready PR on develop; started from the cockpit.
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: bash .ai/scripts/bootstrap.sh
  - id: fix
    name: om-auto-fix-issue
    prompt: '/om-auto-fix-issue {{task}}'
    # `Task` / `Agent` (old and new name of one tool) dispatch the review personas in .claude/agents
    # (CODE_REVIEW.md -> Review personas).
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Task, Agent]
