# A human added `autofix` to an issue. om-auto-fix-issue classifies it and drives the whole
# chain (verify, root cause, fix, PR, review, QA for UI fixes) to a reviewed PR on develop
# (ADR 0017). The repo-local override (.ai/skills/om-auto-fix-issue/) removes `autofix` as its
# first mutation, so a label still present is a run nobody took. No bashAllowlist by design:
# the tracker descriptor is shell functions and jq; the hooks in .claude/hooks/ and the PAT
# scopes are the gate. HUSKY=0 skips the `prepare` hook install, so the run never rewrites
# core.hooksPath on the host clone; .husky/pre-commit skips itself under CEZ_TASK_ID, so commits
# in the run are gated by validation.commands only.
name: issue-autofix
description: Human added `autofix`; om-auto-fix-issue drives the issue to a reviewed PR on develop.
steps:
  - id: setup
    name: Install dependencies and generate the route tree
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm generate-routes
  - id: fix
    name: om-auto-fix-issue
    prompt: '/om-auto-fix-issue {{task}}'
    model: opus
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite]
