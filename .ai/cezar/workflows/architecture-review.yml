# Mondays, on a schedule (docs/agents/cezar-automations.json). afk-architecture-review reads the
# last 30 days of hot spots and files at most three refactor issues. Its rules say it is read-only
# on code and that the only writes are GitHub issues, so the step holds no Edit and no Write. It
# never applies `ready-for-agent` itself: `Strong` gets `needs-triage` and the ladder continues
# from there.
name: architecture-review
description: Find deepening opportunities in recent hot spots and file at most three refactor issues (afk-architecture-review).
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm generate-routes
  - id: afk-architecture-review
    name: afk-architecture-review
    prompt: '/afk-architecture-review {{task}}'
    model: opus
    allowedTools: [Read, Grep, Glob, Bash, Skill, TodoWrite]
