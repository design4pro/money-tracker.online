# The implement workflow: one ready ticket becomes one draft PR to develop, without a human
# in the loop (ADR 0014). Started by the `implement` automation when a human adds
# `run: implement` (docs/agents/cezar-automations.json), or from the cockpit with the same
# task text (`<n> <url>`). Autonomous runs are the norm here; the skill still stops on the
# conditions it lists and hands back through cez-handback.sh, never by itself.
name: implement-ticket
description: Claim a ready ticket, set up the worktree, implement it TDD-first, climb the ladder, hand back a draft PR or a needs-human digest.
steps:
  - id: claim
    name: Claim the ticket
    command: scripts/agent/cez-claim.sh
  - id: setup
    name: Install, routes, e2e environment
    command: scripts/agent/cez-setup.sh
  - id: implement
    name: Implement and hand back
    prompt: '/implement-ticket {{task}}'
    model: opus
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite]
    bashAllowlist:
      - pnpm typecheck
      - pnpm lint
      - pnpm test
      - pnpm generate-routes
      - pnpm db:generate
      - git add
      - git commit
      - git status
      - git diff
      - git log
      - gh issue view
      - scripts/agent/cez-test.sh
      - scripts/agent/cez-ladder.sh
      - scripts/agent/cez-reseed.sh
      - scripts/agent/cez-handback.sh
