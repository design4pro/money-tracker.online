# The last step of the unattended issue pipeline (ADR 0017): started by the Reconciler
# (docs/agents/cezar.md, ADR 0030) with `Implement issue #<n>.` when
# `node .ai/scripts/backlog-status.mjs --plan` lists an `implement` action, by "Implement the next
# ready issue" every two hours with no issue in the task, or by a person from the cockpit with one,
# and it ends with the pull request merged into `develop` (or waiting for the owner's `qa-approved`
# when it is `risk-high`) - the boundary is `SDLC.md` § The automation contract. There is no label
# that marks an issue ready (ADR 0029): readiness is computed by .ai/scripts/backlog-status.mjs, the
# same rule the backlog report shows.
#
# The gate calls scripts/ci/run-validation.mjs rather than listing commands. The list lives in
# exactly one place, .ai/agentic.config.json -> validation.commands, and this file used to be the
# second copy of it.
#
# `$CEZ_HANDOFF_FILE` is cezar's per-run handoff file - an absolute path outside the worktree, in
# the main checkout's gitignored .ai/cezar/runs/. It is the only channel between these steps, so
# what has to travel goes through it: the `ISSUE:` line, the `STOP:` line and the Resolved
# assumptions table. The steps match any line starting `STOP:`, never "the first line", because cezar prepends
# its own step entries to that file's progress log after every step.
name: implement-ticket
description: Implement one ready issue test-first from its Agent Brief, pass the validation gate, open a PR and drive it through review, QA and CI to the merge into develop.
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: bash .ai/scripts/bootstrap.sh
  - id: implement
    name: Pick the issue, check readiness and implement
    prompt: |
      /om-fix {{task}}

      This workflow has no om-root-cause step: the issue's `## Agent Brief` (a triage comment, or the body of a ticket `afk-to-tickets` filed) is your brief.

      Pick the issue. When the task names an issue number, that is the issue. Otherwise run `node .ai/scripts/backlog-status.mjs --next`: it prints the number of the one issue to implement, or nothing when no issue is ready or three PRs are already waiting for a person (the WIP limit: `needs-qa` without `qa-approved`, `risk-high`, `security`, `blocked`, `do-not-merge`, or `changes-requested` with no update for 24 hours; a PR the pipeline merges itself does not count). Append a line `ISSUE: #<number>` to the file `$CEZ_HANDOFF_FILE`; later steps read it.

      Check readiness before claiming. Stop without changing anything if any of these hold:
      - `--next` printed nothing;
      - the issue is closed, or carries `in-progress`, `blocked`, `do-not-merge` or `do-not-close`;
      - it has no Agent Brief;
      - an issue listed under "Blocked by" is still open;
      - an open PR already addresses it.
      To stop: append a line `STOP: <reason>` to the file `$CEZ_HANDOFF_FILE`, then end with CEZ:DONE. Later steps grep that file for such a line and skip. When you stop on an issue that `--next` picked, also post a 🤖 comment on it containing `STOP: <reason>`: `backlog-status.mjs` reads it as not ready until a person answers, so the schedule does not pick the same issue every tick.

      Otherwise implement per om-fix, with these rules:
      - When the brief's deliverable is a spec (afk-triage briefs a request too large for a few slices that way), write that spec under `.ai/specs/` in the shape of the existing specs instead of code, with `Status` `ready` and `Issue` naming this issue. Nobody flips the status afterwards, but a person merges that spec PR: `om-pr-autopilot` ends at merge-ready on it, because only a spec `afk-plan-to-spec` writes merges by itself (ADR 0030). `afk-to-tickets` slices it once it merges.
      - Test first at the brief's Test seam, through the module's interface: write the failing test, see it fail, then make it pass (afk-codebase-design).
      - Build one complete vertical slice, inside the acceptance criteria and "Out of scope".
      - Use CONTEXT.md terms. Add or update entries for any concept you introduce or rename (afk-domain-modeling).
      - Settle each decision the brief left open through `.ai/skills/afk-decide/SKILL.md` instead of stopping, and append each verdict to `$CEZ_HANDOFF_FILE` under a `## Resolved assumptions` heading, as a `# | Question | Applied default | Why` row. The PR step reads that table from there.
      - Re-derive the risk before claiming, from the area the brief touches rather than from the label: authentication and sessions, tenant scoping, money, schema migrations, CI and `.github/`, `.claude/`, hooks and shared contracts make it `risk-high` whatever the label says, because the label was set by a run that read the untrusted issue body. For a `risk-high` or `security` issue, the brief must carry the security and tenancy specialist's approving verdict; meet its CONDITIONS as acceptance criteria. Without that verdict, get one through `afk-decide` before claiming. If the specialist does not approve, STOP: do not claim; add `blocked` to the issue and post a comment whose first line is `🤖 HUMAN-ONLY: <the one thing a person has to decide>`, then the verdict.
      - A lesson worth keeping goes in a `## Lessons` section of `$CEZ_HANDOFF_FILE` and the PR body, never into files outside the worktree (such as `~/.claude/CLAUDE.md`); `afk-lessons` collects it.
    # Agent: open questions go to an independent specialist sub-agent (.ai/skills/afk-decide/SKILL.md).
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
  - id: gate
    name: Validation gate
    command: grep -q '^STOP:' "$CEZ_HANDOFF_FILE" || node scripts/ci/run-validation.mjs
    onFail:
      retry: implement
      max: 3
  - id: pr
    name: Open the PR
    prompt: |
      /om-open-pr {{task}}

      If `grep -q '^STOP:' "$CEZ_HANDOFF_FILE"` succeeds, print that line and end at once with CEZ:DONE.

      Otherwise open the PR per om-open-pr, with the issue number from the `ISSUE:` line of `$CEZ_HANDOFF_FILE` as the issue id. Copy the `## Resolved assumptions` table, and the `## Lessons` section when there is one, out of `$CEZ_HANDOFF_FILE` into the PR body, and reference the issue with `Fixes #<number>`.
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite]
  # The chain does not stop at an open PR: om-pr-autopilot reviews, fixes, runs QA, waits for CI and
  # merges into develop (ADR 0027) - the develop ruleset requires no approving review. It never
  # merges the develop -> main promotion, and a `risk-high` PR waits for the owner's `qa-approved`.
  - id: merge
    name: Drive the PR to the merge into develop
    prompt: |
      End at once with CEZ:DONE if either holds:
      - `grep -q '^STOP:' "$CEZ_HANDOFF_FILE"` succeeds;
      - no PR is open for this branch (`gh pr list --head "$(git branch --show-current)"`).

      Otherwise run `/om-pr-autopilot <that PR number> --allow-merge` for the PR of {{task}}:
      - Review reports the Standards axis and the Spec axis separately (CODE_REVIEW.md), and the Spec axis checks each acceptance criterion from the issue's Agent Brief.
      - Merge only into `develop`.
    # `Task` / `Agent` (old and new name of one tool) dispatch the review personas in .claude/agents
    # (CODE_REVIEW.md -> Review personas).
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Task, Agent]
