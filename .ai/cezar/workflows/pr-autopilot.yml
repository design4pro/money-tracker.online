# A human opened a pull request (the "Autopilot new pull requests" automation filters on authors). om-pr-autopilot
# diagnoses it and runs the right chain: continue, fix, review, QA. `--allow-merge` is absent on
# purpose: nothing autonomous merges here; a human runs om-approve-merge-pr from the cockpit
# (ADR 0017).
name: pr-autopilot
description: om-pr-autopilot on one PR - diagnose, then continue / fix / review / QA; never merges.
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm generate-routes
  - id: autopilot
    name: om-pr-autopilot
    prompt: '/om-pr-autopilot {{task}}'
    # `Task` dispatches the review personas in .claude/agents (CODE_REVIEW.md -> Review personas).
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Task]
