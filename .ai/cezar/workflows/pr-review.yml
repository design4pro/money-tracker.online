# Started from the cockpit on one PR number. om-auto-review-pr runs om-code-review (CODE_REVIEW.md,
# BACKWARD_COMPATIBILITY.md), submits approve or request-changes, sets pipeline labels, and with
# --autofix loops fix / validate / re-review on the agent's own PRs (ADR 0017).
name: pr-review
description: om-auto-review-pr --autofix on one PR - code review, pipeline labels, autofix loop on agent PRs.
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm generate-routes
  - id: review
    name: om-auto-review-pr
    prompt: '/om-auto-review-pr {{task}} --autofix'
    # `Task` / `Agent` (old and new name of one tool) let the review dispatch the persona subagents in .claude/agents
    # (CODE_REVIEW.md -> Review personas). Each persona's own grant is narrower than this one.
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Task, Agent]
