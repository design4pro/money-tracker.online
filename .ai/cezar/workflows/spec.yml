# A human added `spec` to a `feature` issue. om-auto-write-spec writes .ai/specs/<date>-<slug>.md
# and lands it on a design-only PR (`spec/<slug>`) for a human to review; implementation is a
# separate run (implement-spec) once that PR merges (ADR 0017).
name: spec
description: Human added `spec`; om-auto-write-spec turns the feature issue into a spec file on a design-only PR.
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm generate-routes
  - id: spec
    name: om-auto-write-spec
    prompt: '/om-auto-write-spec {{task}}'
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite]
