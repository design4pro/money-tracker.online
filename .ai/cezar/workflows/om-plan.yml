# Planning is interactive: start it from the cockpit with **Autonomous off** and the idea (or
# the issue number) as the task. om-brainstorm works one idea through its hard gate and writes
# the brief under .ai/specs/briefs/; its `Next:` line names the follow-up the human runs next
# (`/om-spec-writing`, then `/om-prepare-issue` per phase, per SDLC.md). Nothing here is
# automated and nothing here writes to src/.
name: om-plan
description: Interactive brainstorm of one idea with om-brainstorm (run with Autonomous off).
steps:
  - id: setup
    name: Install dependencies and the om skills
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm install-skills
  - id: brainstorm
    name: om-brainstorm
    prompt: '/om-brainstorm {{task}}'
    model: opus
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite]
