# A PR that stalled: red CI, a review with changes requested, a failed QA, a conflict with
# develop. om-pr-autopilot diagnoses the state and runs the right chain (om-auto-fix-pr,
# om-auto-continue-pr, review, QA); without `--allow-merge` it never merges. Started by a human
# from the cockpit with the PR number as the task.
name: om-autopilot
description: Diagnose one stalled pull request and run the right repair chain with om-pr-autopilot.
steps:
  - id: setup
    name: Install dependencies and the om skills
    command: HUSKY=0 pnpm install --frozen-lockfile --prefer-offline && pnpm install-skills
  - id: autopilot
    name: om-pr-autopilot
    prompt: '/om-pr-autopilot {{task}}'
    model: opus
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite]
