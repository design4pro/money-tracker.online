# The planning workflow: spec -> PRD -> tickets for one GitHub issue, with a human in the loop.
# Start it from the cockpit: GitHub tab -> issue -> "Hand this to the agent" -> workflow `plan`,
# prompt `spec`, `prd` or `tickets` (the issue number and link are always sent). Leave
# "Autonomous" OFF: the skill asks through CEZ:ASK and refuses to continue when nudged.
#
# Only the last agent step is interactive in cezar, so the two deterministic steps come first
# as commands and the skill is the last step of the file.
name: plan
description: Spec, PRD and tickets for one issue, one mode per run (spec | prd | tickets); every artefact stops at status review for a human.
steps:
  - id: claim
    name: Claim the issue
    command: scripts/agent/cez-plan-claim.sh
  - id: setup
    name: Install and generate routes
    command: scripts/agent/cez-setup.sh --no-e2e
  - id: plan
    name: Plan with the human
    prompt: '/plan-feature {{task}}'
    model: opus
    allowedTools: [Read, Grep, Glob, Edit, Write, Bash, Skill, TodoWrite]
    bashAllowlist:
      - gh issue view
      - gh issue list
      - gh pr list
      - git status
      - git diff
      - git log
      - git add CONTEXT.md
      - git add docs/adr
      - git commit
      - scripts/agent/gh-ro.sh
      - scripts/agent/publish-spec.sh
      - scripts/agent/publish-prd.sh
      - scripts/agent/publish-tickets.sh
      - scripts/agent/cez-docs-pr.sh
      - scripts/agent/cez-plan-handback.sh
